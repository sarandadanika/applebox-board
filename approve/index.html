<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apple Box · Video approval</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect x='40' y='62' width='120' height='108' rx='10' fill='%23e6332a'/%3E%3Cpolygon points='84,88 84,144 132,116' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
body{font-size:14.5px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;margin-bottom:14px} .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.title{font-size:19px;font-weight:800;line-height:1.3} .sub{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:8px;padding:12px 18px;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:1}
.btn.ok{background:var(--done);border-color:var(--done);color:#fff} .btn.no{border-color:var(--accent);color:var(--accent)} .btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:96px;resize:vertical;margin:8px 0 10px}
.flag{padding:12px 14px;border-radius:8px;font-weight:700;border:1px solid;margin-bottom:14px} .flag.ok{color:var(--done);border-color:var(--done)} .flag.no{color:var(--accent);border-color:var(--accent)} .flag.wait{color:var(--doing);border-color:var(--doing)}
.dec{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px} .dec:last-child{border-bottom:0}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);align-self:start}
.pill.ok{border-color:var(--done);color:var(--done)} .pill.no{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--ink-3);font-size:12.5px} .err{color:#c0392b;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../firebase-config.js"></script>
<script type="module" src="../store.js"></script>
<script>
/* Approver page. Opened from the private link …/approve/#<token>. The approver signs in with Google,
   sees ONE request (the public copy intake/apr-<token>) and approves or rejects it with a comment.
   Nothing here can read the board: Firestore rules only give board data to team members. */
const logo='<svg width="36" height="36" viewBox="0 0 200 200" aria-hidden="true"><polygon points="40,62 100,34 100,70 40,98" fill="#b8241c"/><polygon points="160,62 100,34 100,70 160,98" fill="#ff5a4a"/><rect x="40" y="62" width="120" height="108" rx="10" fill="#e6332a"/><polygon points="84,88 84,144 132,116" fill="#fff"/></svg>';
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emailKey=e=>String(e||"").toLowerCase().replace(/\./g,",");
const mask=e=>{ const [a,b]=String(e).split("@"); return (a||"").slice(0,2)+"•••@"+(b||""); };
let token=(location.hash||"").replace(/[^a-f0-9]/g,"");
const S=()=>window.AppleBoxStore;
let user=undefined, req=undefined, mode=null, draft="", busy=false, errMsg="", authErr="", un=null, shownVideo="";
/* "My approval history": every approver keeps their own list at intake/aph-<their Firebase uid>. The uid is
   only known to the signed-in person and these documents cannot be listed, so nobody else can find it.
   items.<token> = { title, videoId, version, firstAt, lastAt, log:{ id:{version,decision,comment,at} } } */
let hist=undefined, unHist=null, liveReq={}, seenSaved="", inbox=null, unInbox=null, regSaved="";
let editing=false, eTitle="", eDesc="";
const histPath=()=>"intake/aph-"+user.uid;

const me=()=>((user&&user.email)||"").toLowerCase();
const decisions=(r=req)=>(r.approvers||[]).map(e=>{ const d=(r.decisions||{})[emailKey(e)]; return {email:e,d:d&&d.version===r.version?d:null}; });
const needed=(r=req)=>{ const n=(r.approvers||[]).length; return r.rule&&r.rule.type==="count"?Math.max(1,Math.min(+r.rule.count||1,n)):n; };
function status(r=req){ if(r.status==="published"||r.status==="cancelled") return r.status; if(r.overridden) return "approved";
  const ds=decisions(r); if(ds.some(x=>x.d&&x.d.decision==="changes")) return "changes"; return ds.filter(x=>x.d&&x.d.decision==="approved").length>=needed(r)?"approved":"review"; }
const mine=(r=req)=>{ const d=(r.decisions||{})[emailKey(me())]; return d&&d.version===r.version?d:null; };
const ST={review:["Waiting for approval",""],changes:["Rejected · changes requested","no"],approved:["Approved","ok"],published:["Published","ok"],cancelled:["Cancelled",""]};
const when=t=>t?new Date(t).toLocaleString():"";
const canDecide=()=>req.status==="review"&&!req.overridden&&(req.approvers||[]).includes(me());

const head=()=>`<header class="top" style="margin-bottom:16px;align-items:center"><div class="brand">${logo}<div><h1>Apple Box — video approval</h1><p class="sub">${token?'Please review this video before it goes public':'Your videos to review'}</p></div></div>${user&&token?'<button class="btn dark" data-hist="1" style="flex:0 0 auto;min-height:40px;padding:9px 16px;font-size:14px">My approvals</button>':''}</header>`;
function shell(inner){ document.getElementById('root').innerHTML=head()+inner; shownVideo=""; }
function render(){
  if(user===undefined) return shell(`<div class="box muted">Checking sign-in…</div>`);
  if(!user) return shell(`<div class="box"><div class="title" style="font-size:17px">Sign in to review the video</div><p class="muted" style="margin:6px 0 14px">Use the Google (Gmail) account that the Apple Box team has for you. It only confirms who is approving — nothing is posted anywhere.</p>
    <div class="row"><button class="btn dark" data-signin="1">Sign in with Google</button></div>${authErr?`<div class="err">${esc(authErr)}<br>If the sign-in window does not open, open this link in Chrome or Safari instead of inside WhatsApp.</div>`:''}</div>`);
  if(!token) return shell(histHTML());
  if(req===undefined) return shell(`<div class="box muted">Loading…</div>`);
  if(!req||req.kind!=="approval") return shell(`<div class="box">This approval link is no longer valid. The request may have been removed — please ask the Apple Box team for a new link.</div>${account()}`);
  if(!(req.approvers||[]).includes(me())) return shell(`<div class="box"><div class="title" style="font-size:17px">This review is not shared with ${esc(user.email)}</div><p class="muted" style="margin:6px 0 0">It was sent to: ${(req.approvers||[]).map(mask).map(esc).join(", ")}. Sign in with that Google account, or ask the Apple Box team to add this address.</p></div>${account()}`);
  if(shownVideo!==req.videoId+"|"+req.version){                      // build the player once, then only refresh the text under it
    document.getElementById('root').innerHTML=head()+`<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${esc(req.videoId)}?rel=0" title="Video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div id="body"></div>`;
    shownVideo=req.videoId+"|"+req.version; }
  document.getElementById('body').innerHTML=bodyHTML();
}
const account=()=>`<div class="muted" style="text-align:center;margin:18px 0">${token?'<a href="#" data-hist="1">My approvals (pending, approved, history)</a> · ':''}Signed in as ${esc(user.email)} · <a href="#" data-signout="1">use another account</a></div>`;
const decRow=d=>`<div class="dec"><div>Version ${esc(d.version)}${d.comment?`<div style="white-space:pre-wrap;color:var(--ink-2)">${esc(d.comment)}</div>`:''}<div class="muted" style="font-size:11.5px">${esc(when(d.at))}</div></div><span class="pill ${d.decision==="approved"?'ok':'no'}">${d.decision==="approved"?'You approved':'You rejected'}</span></div>`;
function histHTML(){
  if(hist===undefined) return `<div class="box muted">Loading your approvals…</div>`;
  const ibx=(inbox&&inbox.items)||{}, own=hist.items||{};
  const rows=[...new Set([...Object.keys(ibx),...Object.keys(own)])].map(t=>{ const it=own[t]||{}, ib=ibx[t]||{}, live=liveReq[t], m=live&&mine(live);
    const st=live?status(live):(live===null||ib.removed)?"removed":"checking";
    const todo=!!live&&live.status==="review"&&!live.overridden&&!m&&(st==="review"||st==="changes")&&(live.approvers||[]).includes(me());
    return {t,it,ib,live,m,st,todo,log:Object.values(it.log||{}).sort((a,b)=>(b.at||0)-(a.at||0)),at:Math.max(it.lastAt||0,ib.at||0)}; })
    .filter(r=>r.st!=="removed"||r.log.length)                       // removed requests stay only if I decided on them
    .sort((a,b)=>b.at-a.at);
  const card=r=>{ const live=r.live, s=ST[r.st];
    return `<div class="box"><div style="display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start"><img src="https://i.ytimg.com/vi/${esc((live&&live.videoId)||r.it.videoId||r.ib.videoId)}/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:112px;height:63px;object-fit:cover;border-radius:6px;background:var(--surface-2)">
      <div><b>${esc((live&&live.title)||r.it.title||r.ib.title)}</b> <span class="muted">v${esc((live&&live.version)||r.it.version||r.ib.version||1)}</span>
        <div style="margin:4px 0">${r.st==="checking"?'<span class="pill">Checking…</span>':r.st==="removed"?'<span class="pill">Request removed</span>':`<span class="pill ${s[1]}">${s[0]}</span>`}${r.todo?' <span class="pill no">Your decision is needed</span>':''}</div>
        <div class="muted">${live&&live.publishAt?'Planned publish '+esc(String(live.publishAt).replace("T"," "))+' · ':''}${r.it.firstAt?'first opened '+esc(when(r.it.firstAt)):'not opened yet'}</div></div></div>
      ${r.log.length?`<div style="margin-top:10px">${r.log.map(decRow).join('')}</div>`:''}
      ${live?`<div class="row" style="margin-top:10px"><button class="btn ${r.todo?'dark':''}" data-open="${esc(r.t)}" style="flex:0 0 auto;min-height:38px;padding:8px 14px;font-size:13.5px">${r.todo?'Review now':'Open'}</button></div>`:''}</div>`; };
  const G=[["Pending · waiting for your decision",rows.filter(r=>r.todo),"Nothing is waiting for you."],
           ["Approved",rows.filter(r=>r.st==="approved"&&!r.todo)],
           ["In review · waiting for other approvers",rows.filter(r=>r.st==="review"&&!r.todo)],
           ["Rejected · the team is fixing it",rows.filter(r=>r.st==="changes"&&!r.todo)],
           ["Published",rows.filter(r=>r.st==="published")],
           ["Cancelled or removed",rows.filter(r=>r.st==="cancelled"||r.st==="removed")],
           ["Checking…",rows.filter(r=>r.st==="checking")]];
  let h=`<div class="box"><div class="title" style="font-size:17px">My approvals</div><p class="sub">All videos the Apple Box team asked you to review with this Google account.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><span class="pill no">Pending ${G[0][1].length}</span><span class="pill ok">Approved ${G[1][1].length}</span><span class="pill">In review ${G[2][1].length}</span><span class="pill">Rejected ${G[3][1].length}</span><span class="pill ok">Published ${G[4][1].length}</span></div></div>`;
  if(!rows.length) h+=`<div class="box muted">Nothing here yet. Open an approval link from the Apple Box team once — after that, every new request for you shows up here automatically.</div>`;
  G.forEach(([title,list,empty],i)=>{ if(!list.length&&!(empty&&rows.length)) return; h+=`<h3 style="margin:18px 2px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">${title} · ${list.length}</h3>${list.map(card).join('')||`<div class="box muted">${empty}</div>`}`; });
  return h+account(); }
function loadLive(){ [...new Set([...Object.keys((hist&&hist.items)||{}),...Object.keys((inbox&&inbox.items)||{})])].forEach(t=>{ if(t in liveReq) return; liveReq[t]=undefined;   // current state of each request
  S().get("intake/apr-"+t).then(d=>{ liveReq[t]=d&&d.kind==="approval"?d:null; if(!token) render(); }).catch(()=>{ liveReq[t]=null; if(!token) render(); }); }); }
/* Inbox: so that requests show up before I ever open them, I own a random inboxKey (kept in my private history
   doc). Opening any request tells the board that key (reg.<my email>); from then on the board lists every
   request it sends me in intake/apx-<inboxKey>. */
function ensureInbox(){ if(!hist||!user) return;
  if(!hist.inboxKey){ hist.inboxKey=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""); S().merge(histPath(),{kind:"approver-history",email:me(),inboxKey:hist.inboxKey},user.displayName||me()).catch(e=>console.error(e)); }
  if(!unInbox) unInbox=S().watch("intake/apx-"+hist.inboxKey,d=>{ inbox=d||{}; if(!token){ loadLive(); render(); } },err=>console.error(err)); }
function noteSeen(){ if(!req||req.kind!=="approval"||!hist||!(req.approvers||[]).includes(me())) return;                      // remember this request in my history
  if(hist.inboxKey&&regSaved!==token&&((req.reg||{})[emailKey(me())]||{}).inboxKey!==hist.inboxKey){ regSaved=token; S().merge("intake/apr-"+token,{reg:{[emailKey(me())]:{inboxKey:hist.inboxKey,at:Date.now()}}},user.displayName||me()).catch(e=>console.error(e)); }
  const k=token+"|"+req.version+"|"+req.title; if(seenSaved===k) return; seenSaved=k; const old=(hist.items||{})[token];
  S().merge(histPath(),{kind:"approver-history",email:me(),items:{[token]:{title:req.title||"",videoId:req.videoId||"",version:req.version,firstAt:(old&&old.firstAt)||Date.now(),lastAt:Date.now()}}},user.displayName||me()).catch(e=>console.error(e)); }
function go(t){ token=t||""; try{ history.pushState(null,"",token?"#"+token:location.pathname); }catch(e){} mode=null; editing=false; draft=""; errMsg=""; if(!token) liveReq={}; openReq(); window.scrollTo(0,0); }
function openReq(){ if(un){ un(); un=null; } req=undefined; render(); if(!user) return; if(!token){ loadLive(); return; }
  un=S().watch("intake/apr-"+token,d=>{ req=d; liveReq[token]=d&&d.kind==="approval"?d:null; noteSeen(); if(!mode&&!editing) render(); },err=>{ req=null; render(); }); }
/* The approver may propose a caption (title) and description. It is stored in the public copy as
   suggest.<emailKey> = {version,title,description,name,email,at,applied}; the team sees it on the board and applies it. */
const mySuggest=()=>(req.suggest||{})[emailKey(me())]||null;
const FIELD='width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 10px';
function suggestHTML(){ const s=mySuggest(), open=req.status==="review"&&(req.approvers||[]).includes(me());
  if(editing) return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h3>Edit the caption and description</h3>
    <label class="muted" for="etitle">Caption / title (max 100 characters)</label><input id="etitle" type="text" maxlength="100" value="${esc(eTitle)}" style="${FIELD}">
    <label class="muted" for="edesc">Description</label><textarea id="edesc" style="min-height:180px;margin-top:4px">${esc(eDesc)}</textarea>
    <div class="row"><button class="btn" data-edit-cancel="1" ${busy?'disabled':''}>Cancel</button><button class="btn dark" data-edit-save="1" ${busy?'disabled':''}>${busy?'Saving…':'Send to the team'}</button></div>${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}
    <p class="muted" style="margin:10px 0 0">The Apple Box team sees your text and puts it on the video. You can still approve or reject below.</p></div>`;
  let h='';
  if(s) h+=`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h3>Your caption and description · ${s.applied?'applied by the team':'sent to the team'}</h3><div><b>${esc(s.title)}</b></div><div style="white-space:pre-wrap;color:var(--ink-2);margin-top:4px">${esc(s.description||'—')}</div><div class="muted" style="font-size:11.5px;margin-top:4px">${esc(when(s.at))}</div></div>`;
  if(open) h+=`<div class="row" style="margin-top:12px"><button class="btn" data-edit="1" style="flex:0 0 auto;min-height:38px;padding:8px 14px;font-size:13.5px">${s?'Change my caption and description':'Edit caption and description'}</button></div>`;
  return h; }
async function saveSuggest(){ const title=eTitle.trim(), description=eDesc.trim();
  if(!title){ errMsg="The caption / title cannot be empty."; render(); return; }
  if(title===(req.title||"")&&description===(req.description||"")){ errMsg="Nothing changed yet."; render(); return; }
  const entry={version:req.version,title:title.slice(0,100),description:description.slice(0,5000),name:user.displayName||user.email,email:me(),at:Date.now(),applied:false};
  busy=true; errMsg=""; render();
  try{ await S().merge("intake/apr-"+token,{suggest:{[emailKey(me())]:entry}},entry.name); req.suggest={...(req.suggest||{}),[emailKey(me())]:entry}; editing=false; }
  catch(err){ errMsg="Could not save: "+(err.code||err.message); }
  busy=false; render(); }
function bodyHTML(){ const st=status(), m=mine(), ds=decisions(), ok=ds.filter(x=>x.d&&x.d.decision==="approved").length;
  let h=`<div class="box"><div class="title">${esc(req.title)}</div><p class="sub">Version ${esc(req.version)}${req.uploader?' · uploaded by '+esc(req.uploader):''}${req.publishAt?' · planned publish '+esc(String(req.publishAt).replace("T"," ")):''} · <a href="${esc(req.url)}" target="_blank" rel="noopener">open on YouTube</a></p>
    ${req.note?`<p class="sub">What changed in this version: ${esc(req.note)}</p>`:''}
    <h3 style="margin-top:14px">Description that will go live</h3><div style="white-space:pre-wrap">${esc(req.description||'—')}</div>${suggestHTML()}</div>`;
  if(req.status==="published") h+=`<div class="flag ok">This video has been published. Thank you.</div>`;
  else if(req.status==="cancelled") h+=`<div class="flag no">This request was cancelled. No decision is needed.</div>`;
  else if(canDecide()){
    if(mode) h+=`<div class="box"><h3>${mode==="approved"?'Approve this video':'Reject — what needs to change?'}</h3>
        <textarea id="comment" placeholder="${mode==="approved"?'Comment (optional)':'Please describe what to fix. You can mention the time, e.g. 02:15 logo is cut off'}">${esc(draft)}</textarea>
        <div class="row"><button class="btn" data-back="1" ${busy?'disabled':''}>Back</button><button class="btn ${mode==="approved"?'ok':'no'}" data-confirm="1" ${busy?'disabled':''}>${busy?'Saving…':mode==="approved"?'Confirm approval':'Send rejection'}</button></div>${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}</div>`;
    else h+=`${m?`<div class="flag ${m.decision==="approved"?'ok':'no'}">You ${m.decision==="approved"?'approved':'rejected'} this video${m.comment?': “'+esc(m.comment)+'”':''}. You can change your decision until it is published.</div>`:`<div class="flag wait">Your decision is needed</div>`}
      <div class="box"><h3>Your decision</h3><p class="muted" style="margin:0 0 12px">Watch the video above, then choose. You can add a comment in the next step.</p><div class="row"><button class="btn ok" data-mode="approved">Approve</button><button class="btn no" data-mode="changes">Reject / request changes</button></div></div>`;
  }
  const past=Object.values(req.dlog||{}).filter(d=>d.email===me()).sort((a,b)=>(b.at||0)-(a.at||0));
  if(past.length>1||(past.length===1&&!m)) h+=`<div class="box"><h3>Your earlier decisions on this video</h3>${past.map(decRow).join('')}</div>`;
  h+=`<div class="box"><h3>Approvers · ${ok} of ${needed()} needed approvals</h3>${ds.map(x=>`<div class="dec"><div><b>${esc((x.d&&x.d.name)||(x.email===me()?user.displayName||x.email:mask(x.email)))}</b>${x.email===me()?' <span class="muted">(you)</span>':''}${x.d&&x.d.comment?`<div style="white-space:pre-wrap;color:var(--ink-2)">${esc(x.d.comment)}</div>`:''}${x.d?`<div class="muted" style="font-size:11.5px">${new Date(x.d.at).toLocaleString()}</div>`:''}</div><span class="pill ${x.d?(x.d.decision==="approved"?'ok':'no'):''}">${x.d?(x.d.decision==="approved"?'Approved':'Rejected'):'Waiting'}</span></div>`).join('')}
    <p class="muted" style="margin:10px 0 0">${st==="approved"?'Approved — the team can now publish it.':st==="changes"?'Rejected — the team will upload a corrected version and ask again.':'The team publishes only after approval.'}</p></div>`;
  return h+account(); }

document.addEventListener('click',async e=>{ const t=e.target; let b;
  if(t.closest('[data-signin]')){ authErr=""; S().signIn().catch(err=>{ authErr="Sign-in failed: "+(err.code||err.message); render(); }); return; }
  if(t.closest('[data-signout]')){ e.preventDefault(); S().signOut(); return; }
  if(t.closest('[data-edit]')){ const s=mySuggest(); editing=true; eTitle=(s&&!s.applied?s.title:req.title)||""; eDesc=(s&&!s.applied?s.description:req.description)||""; errMsg=""; render(); const el=document.getElementById('etitle'); if(el) el.focus(); return; }
  if(t.closest('[data-edit-cancel]')){ editing=false; errMsg=""; render(); return; }
  if(t.closest('[data-edit-save]')){ saveSuggest(); return; }
  if(t.closest('[data-hist]')){ e.preventDefault(); go(""); return; }
  if(b=t.closest('[data-open]')){ go(b.dataset.open); return; }
  if(b=t.closest('[data-mode]')){ mode=b.dataset.mode; const m=mine(); draft=m&&m.decision===mode?(m.comment||""):""; errMsg=""; render(); const c=document.getElementById('comment'); if(c) c.focus(); return; }
  if(t.closest('[data-back]')){ mode=null; errMsg=""; render(); return; }
  if(t.closest('[data-confirm]')){ const comment=draft.trim(); if(!canDecide()) return;
    if(mode==="changes"&&!comment){ errMsg="Please say what needs to change."; render(); return; }
    const entry={version:req.version,decision:mode,comment:comment.slice(0,2000),name:user.displayName||user.email,email:me(),at:Date.now()};
    busy=true; errMsg=""; render();
    try{ await S().merge("intake/apr-"+token,{decisions:{[emailKey(me())]:entry},dlog:{["d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]:entry}},entry.name);
      req.decisions={...(req.decisions||{}),[emailKey(me())]:entry}; mode=null; draft="";
      S().merge(histPath(),{items:{[token]:{title:req.title||"",videoId:req.videoId||"",version:req.version,lastAt:entry.at,log:{["d"+entry.at.toString(36)]:{version:entry.version,decision:entry.decision,comment:entry.comment,at:entry.at}}}}},entry.name).catch(e2=>console.error(e2)); }
    catch(err){ errMsg="Could not save: "+(err.code||err.message); }
    busy=false; render(); window.scrollTo({top:document.getElementById('body').offsetTop-10,behavior:"smooth"}); }
});
document.addEventListener('input',e=>{ if(e.target.id==='comment') draft=e.target.value; if(e.target.id==='etitle') eTitle=e.target.value; if(e.target.id==='edesc') eDesc=e.target.value; });

document.addEventListener('applebox-store-ready',()=>{
  if(!S().configured){ user=null; authErr="Not connected — please try again later."; render(); return; }
  S().onAuth(u=>{ user=u||null; if(unHist){ unHist(); unHist=null; } if(unInbox){ unInbox(); unInbox=null; } hist=undefined; inbox=null; liveReq={}; seenSaved=""; regSaved=""; mode=null;
    if(user) unHist=S().watch(histPath(),d=>{ hist=d||{}; ensureInbox(); if(!token){ loadLive(); render(); } else noteSeen(); },err=>{ hist={}; if(!token) render(); });
    openReq(); });
});
window.addEventListener('hashchange',()=>{ const t=(location.hash||"").replace(/[^a-f0-9]/g,""); if(t!==token){ token=t; mode=null; openReq(); } });
render();
</script>
</body>
