<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Box · Launch Board (internal)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect x='40' y='62' width='120' height='108' rx='10' fill='%23e6332a'/%3E%3Cpolygon points='84,88 84,144 132,116' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.summary{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:6px;min-width:220px}
.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.meter-label b{color:var(--ink);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--done)} .bar .p{background:var(--doing)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .ld::before{background:var(--done)} .legend .lp::before{background:var(--doing)} .legend .lt::before{background:var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.who input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:150px}
.filters{max-width:1600px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .fl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12px;color:var(--ink-2);background:var(--surface);min-height:28px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
/* kanban */
.kanban{max-width:1600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:12px;align-items:start;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;min-height:200px;scroll-snap-align:start;transition:box-shadow .15s}
.col.drop{box-shadow:0 0 0 2px var(--accent) inset}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 8px;position:sticky;top:0;background:var(--surface-2);border-radius:10px 10px 0 0;z-index:1}
.col-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
.col-h .count{font-size:12px;color:var(--ink-3)}
.col-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grp-h{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 6px;align-items:center;padding:6px 8px;cursor:grab;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:600;color:var(--ink-2)}
.grp-h .bar{grid-column:1/-1;height:4px}
.grp-h .tog{width:22px;height:22px;border-radius:5px;color:var(--ink-3);font-size:12px;background:transparent}
.grp-h .tog:hover{background:var(--surface-2)}
.grp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-n{font-size:11px;color:var(--ink-3);font-weight:500}
.grp.collapsed .grp-b{display:none}
.grp-b{display:flex;flex-direction:column;gap:6px;padding:0 6px 6px;min-height:6px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:grab;touch-action:pan-y;outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.card.dragging{opacity:.35}
.card-top{display:flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.card .t{font-size:13px;line-height:1.35;font-weight:600;user-select:none;-webkit-user-select:none}
.card-actions{display:flex;gap:10px;flex-wrap:wrap}
.key{font-size:11px;color:var(--accent);font-weight:500}
.pri{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}
.pri.Highest{border-color:var(--accent);color:var(--accent)} .pri.High{border-color:var(--doing);color:var(--doing)}
.oname{font-size:12px;color:var(--ink-2)}
.more{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;min-height:22px;background:none;border:0;padding:0;cursor:pointer}
.detail{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;line-height:1.45;padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-top:2px;cursor:auto}
.detail dt{color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:2px}
.detail dd{margin:0} .detail ul{margin:0;padding-left:16px}
.av{--sz:24px;width:var(--sz);height:var(--sz);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.42);font-weight:700;background:var(--ink);color:var(--bg);object-fit:cover;flex-shrink:0;letter-spacing:.02em}
.av.empty{background:transparent;color:var(--ink-3);border:1px dashed var(--line);font-weight:500}
.av.gone{background:var(--line);color:var(--ink-2)}
.avbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%;display:inline-flex}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.25);transform-origin:top left;cursor:grabbing}
.ph{border:2px dashed var(--accent);border-radius:7px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
body.dragging-any{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* modal */
#modal .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60}
#modal .dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;z-index:61;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal h3{margin:0 0 10px;font-size:16px}
#modal .hint{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3);margin-bottom:10px;flex:1}
.fld input,.fld select,.fld textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;box-sizing:border-box}
.row{display:flex;gap:10px} .row3{display:flex;gap:10px} @media (max-width:560px){.row,.row3{flex-direction:column;gap:0}}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
/* answers tab + lists */
.answers{max-width:900px;margin:0 auto}
.answers section{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.answers section.archived{opacity:.6}
.answers .sh{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between}
.answers .sh span.mono{color:var(--ink-3);font-weight:500;font-size:12px}
.ans{display:grid;grid-template-columns:minmax(200px,2fr) 3fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.ans:last-child{border-bottom:0} .ans.archived{opacity:.55}
.ans .q{color:var(--ink-2)} .ans .v{white-space:pre-wrap} .ans .v.empty{color:var(--ink-3);font-style:italic}
.ans.req .q::after{content:" *";color:var(--accent)}
.meta{max-width:900px;margin:0 auto 12px;font-size:12px;color:var(--ink-3)}
/* time tracking */
.tm{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-2)} .tm svg{width:11px;height:11px}
.tiles{max-width:1000px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.tlogs{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.tlog{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.tlog:last-child{border-bottom:0} .tlog .n{color:var(--ink-3);font-size:12px}
/* video approvals */
.st.review{border-color:var(--doing);color:var(--doing)} .st.changes{border-color:var(--accent);color:var(--accent)} .st.approved,.st.published{border-color:var(--done);color:var(--done)}
.vthumb{width:96px;height:54px;object-fit:cover;border-radius:5px;background:var(--surface-2);display:block}
.vgrid{max-width:1200px;margin:0 auto 24px;display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);gap:16px;align-items:start}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden} .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.45}
.vbox h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vflag{padding:10px 12px;border-radius:6px;font-weight:700;margin-bottom:10px;border:1px solid} .vflag.ok{color:var(--done);border-color:var(--done)} .vflag.no{color:var(--accent);border-color:var(--accent)}
.vdec{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)} .vdec:last-child{border-bottom:0}
.vhist{font-size:12px;color:var(--ink-2);padding:3px 0} a.chip{text-decoration:none}
@media (max-width:860px){.vgrid{grid-template-columns:1fr}}
/* invoice sheet */
.invoice{max-width:860px;margin:0 auto 24px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px;font-size:13px}
.invoice h2{margin:0;font-size:24px;letter-spacing:.08em}
.inv-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px} .inv-from{font-size:18px;font-weight:800}
.inv-sub{white-space:pre-line;color:var(--ink-2);font-size:12.5px;margin-top:4px}
.inv-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;margin-bottom:22px}
.inv-meta span,.inv-notes>span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.invoice table{width:100%;border-collapse:collapse} .invoice th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;border-bottom:2px solid var(--ink);padding:6px 8px}
.invoice td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} .invoice .r{text-align:right;white-space:nowrap}
.invoice tfoot td{border-bottom:0;padding:5px 8px} .invoice tr.tot td{font-size:16px;font-weight:800;border-top:2px solid var(--ink);padding-top:10px}
.invoice table.small td{padding:4px 8px;font-size:12px} .inv-notes{margin-top:22px;white-space:pre-line}
@media (max-width:640px){.invoice{padding:16px}.inv-meta{grid-template-columns:1fr}}
@media print{:root{--ink:#111;--ink-2:#333;--ink-3:#666;--line:#ccc;--bg:#fff;--surface:#fff}
  header.top,nav.tabs,.noprint,#modal{display:none!important} body{background:#fff!important;padding:0!important}
  .invoice{border:0;max-width:none;margin:0;padding:0} .invoice tr{break-inside:avoid}}
.tabs{overflow-x:auto;flex-wrap:nowrap} .tab{white-space:nowrap;flex-shrink:0}
@media (max-width:640px){.ans{grid-template-columns:1fr}.kanban{grid-auto-columns:88vw;gap:10px}.col-h{position:static}.tabs .mono,.tabs span:not(.fl){display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" hidden></div>
<script src="firebase-config.js"></script>
<script type="module" src="store.js"></script>
<script>
const PHASES=[{"id":"e1","name":"Agree the basics","owner":"Client (decision maker)","goal":"Before anything is built, the client and the project lead agree on the name, the content, the language and who owns the accounts.","stories":[{"key":"AB-1","title":"Confirm the channel name and handle","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to confirm in writing that the channel is called Apple Box and the handle is @appleboxlk on all platforms","so":"the team can register the same name everywhere without going back and forth","details":"The plain handle @applebox is already taken on YouTube, so we use @appleboxlk. The display name people see stays \"Apple Box\".","ac":["Client replies by email or message: \"Apple Box / @appleboxlk approved\".","Handle is written the same way in all documents."]},{"key":"AB-2","title":"Describe the content the channel will make","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to explain what kind of programmes we will publish (short movies, news, talk shows, live streams, etc.)","so":"the team designs the brand, the channel layout and the posting plan around real content","details":"Think of it like a TV guide: what shows will exist, how long they are, how often they come out. Share 3 to 5 example channels you like.","ac":["A short written list of show types with a one-line description each.","Links to 3–5 example channels."]},{"key":"AB-3","title":"Decide the languages","owner":"Client (decision maker)","priority":"High","as":"the client","want":"to decide whether content, captions and channel text are in Sinhala, Tamil, English or a mix","so":"bios, descriptions and subtitles are prepared correctly from day one","details":"This affects the channel description, video titles, hashtags and thumbnails.","ac":["Languages chosen for: (1) videos, (2) titles and descriptions, (3) replies to comments."]},{"key":"AB-4","title":"Decide who owns the accounts","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"all channels to be created under a company email address that belongs to the business, not to one person","so":"the channel is never lost if a staff member leaves or a personal phone is lost","details":"The project lead will create the accounts but the client company keeps ownership. The client names who will have admin access.","ac":["Company email address provided (or agreed to create one).","List of people who get admin access."]},{"key":"AB-5","title":"Agree what each side delivers","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a simple written agreement on what I deliver and what the client provides","so":"there are no surprises about videos, scripts, tools or advertising budget","details":"Example: the team sets up channels, brand and posting system; the client provides finished videos, actors' permissions and any ad budget.","ac":["One-page scope note sent to and accepted by the client."]}]},{"id":"e2","name":"Brand kit","owner":"Designer","goal":"Everything that makes Apple Box look like one channel everywhere: logo, banners, intro animation and templates.","stories":[{"key":"AB-6","title":"Choose the final logo","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to pick one of the four logo options (or ask for a change)","so":"the designer can produce the final files","details":"Options: A Crate, B Open Box with play button, C AB Cube, D Wordmark. None use an apple fruit, to avoid problems with Apple Inc.","ac":["One option chosen, with any colour or text changes noted."]},{"key":"AB-7","title":"Produce the logo files","owner":"Designer","priority":"High","as":"the designer","want":"to deliver the logo in every size and colour the platforms need","so":"the same logo can be used on YouTube, Facebook, Instagram, TikTok and in videos","details":"Needed: square profile picture, horizontal logo, white version, black version. Formats: PNG (for uploading) and SVG (for printing and video).","ac":["Files delivered in a shared folder named Brand / Logo.","Profile picture looks clear at small size (test at 48 px)."]},{"key":"AB-8","title":"Design the channel banners","owner":"Designer","priority":"High","as":"the designer","want":"to design the large header images for YouTube and Facebook","so":"the channel pages look professional from the first visit","details":"YouTube banner: 2560 × 1440 px (keep the important part in the centre 1546 × 423 px, because phones crop it). Facebook cover: 820 × 312 px. TikTok and Instagram only use the profile picture.","ac":["YouTube and Facebook banners delivered and checked on a phone and a computer."]},{"key":"AB-9","title":"Create the animated logo intro and outro","owner":"Video editor","priority":"Medium","as":"the video editor","want":"a 3–5 second animated logo to put at the start of every video, and an end-screen design","so":"every video is recognisable as Apple Box","details":"A ready-made prompt for AI video tools is available from the project lead. The end screen needs space for \"next video\" and \"subscribe\" buttons.","ac":["Intro delivered as MP4 (1920×1080 and 1080×1080).","Outro template delivered with 20 seconds of space for YouTube end-screen elements."]},{"key":"AB-10","title":"Create thumbnail and title templates","owner":"Designer","priority":"Medium","as":"the designer","want":"a reusable thumbnail design (1280 × 720 px) and an on-screen title style","so":"the editor can make new thumbnails quickly and they all look like one channel","details":"The template should have a place for a big title (max 4–5 words), a photo, and the Apple Box logo.","ac":["Editable template (Canva, Photoshop or Figma) shared with the editor.","Two example thumbnails made from it."]},{"key":"AB-11","title":"Write a one-page brand guide","owner":"Designer","priority":"Low","as":"the designer","want":"a single page showing the colours, fonts, logo rules and tone of voice","so":"anyone who joins later makes things that match","details":"Keep it simple: colour codes, font names, \"do and don't\" logo examples, and three words that describe how Apple Box speaks.","ac":["PDF shared in the Brand folder."]}]},{"id":"e3","name":"Account setup","owner":"Project lead (Danika)","goal":"Create and secure the four channels and connect them to each other.","stories":[{"key":"AB-12","title":"Create a shared company Google account","owner":"Project lead (Danika)","priority":"Highest","as":"the project lead","want":"to create one Google account for Apple Box (for example applebox.media@gmail.com) with security switched on","so":"YouTube and the other tools have one safe home that the company owns","details":"Security = 2-step verification (a code on a phone when signing in), plus a recovery phone number and a recovery email belonging to the client.","ac":["Account created with 2-step verification on.","Recovery phone and email set to the client's details."]},{"key":"AB-13","title":"Store all logins in a shared password manager","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"every channel login kept in a password manager shared with the client","so":"no password is on a piece of paper or in a chat, and the client can always get in","details":"Free options: Bitwarden or 1Password family plan. Also store the 2-step backup codes.","ac":["All four platform logins plus the Google account saved.","Client has confirmed they can open the vault."]},{"key":"AB-14","title":"Set up the YouTube channel","owner":"Project lead (Danika)","priority":"Highest","as":"the project lead","want":"the YouTube channel fully set up and verified","so":"we can upload long videos, use custom thumbnails, and go live","details":"Includes: handle @appleboxlk, logo, banner, description, links, a short channel trailer, and phone verification. Live streaming is switched on 24 hours after it is requested, so do this early.","ac":["Channel page complete (logo, banner, description, links).","Account verified; custom thumbnails, long uploads and live streaming available.","Shorts and Premieres tested once."]},{"key":"AB-15","title":"Set up the Facebook Page","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a Facebook Page for Apple Box with the right category and full details","so":"Facebook shows us as a media channel and lets us post Reels and videos","details":"Category: \"Media/News Company\" or \"TV Channel\". Fill in About, website/links, email. Turn on Reels.","ac":["Page published with logo, cover, About text and links.","At least two people from the client side added as admins."]},{"key":"AB-16","title":"Set up the Instagram account","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"an Instagram professional account connected to the Facebook Page","so":"posts, Reels and messages can be managed together with Facebook","details":"Choose \"Creator\" or \"Business\" account type. Connect it to the Page in Meta Business Suite.","ac":["Account created, bio and logo added.","Connected to the Facebook Page (visible in Meta Business Suite)."]},{"key":"AB-17","title":"Set up the TikTok account","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a TikTok Business account with links to our other channels","so":"short clips reach a younger audience and send people to YouTube","details":"Switch to Business account in settings so we get statistics and can add a website link. Add the YouTube and Instagram links in the profile.","ac":["Business account active; logo, bio and links added."]},{"key":"AB-18","title":"Connect Facebook and Instagram in Meta Business Suite","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"to manage Facebook and Instagram from one screen","so":"one post can go to both and all messages and comments arrive in one inbox","details":"Meta Business Suite is free. It also lets us schedule posts in advance.","ac":["Both accounts visible in Business Suite.","One test post published to both from Business Suite."]},{"key":"AB-19","title":"Link all four profiles to each other","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"each profile to show links to the other three","so":"a viewer who finds us on one platform can follow us everywhere","details":"YouTube: Customisation → Links. Facebook: About → Websites and social links. Instagram and TikTok: the link field in the profile.","ac":["Every profile has links to the other three, checked by clicking each one."]},{"key":"AB-20","title":"Write the bios and pin a welcome post","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"the same short introduction text on every platform and a pinned \"Welcome to Apple Box\" post","so":"new visitors immediately understand what the channel is","details":"Bio: one sentence about what we publish, one about when (\"New short movie every Friday\"), and a link. Adjust length per platform (Instagram 150 characters, TikTok 80).","ac":["Bios live on all four platforms in the agreed languages.","Welcome post pinned on YouTube (community post or trailer), Facebook, Instagram and TikTok."]}]},{"id":"e4","name":"Content system","owner":"Content / video team","goal":"A simple routine so the channel publishes regularly, like a TV schedule.","stories":[{"key":"AB-21","title":"Define the shows and a fixed schedule","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to decide the programme list and when each show is released","so":"viewers know when to come back, just like a TV timetable","details":"Example: short movie every Friday evening, one short clip every day, a behind-the-scenes post on Sundays. Fewer shows done regularly beat many shows done sometimes.","ac":["Written schedule: show name, format, length, release day and time."]},{"key":"AB-22","ti /* ===================== Apple Box Launch Board — app script =====================
   Data lives in Firestore:
     board/meta        { stages:[{id,name}], nextKey }
     epics/{id}        { name, goal, role, order, archived }
     stories/{id}      { key, epicId, title, priority, role, assignee:{email,name}|null,
                         stage, order, as, want, so, details, ac:[], archived,
                         logs:{ logId:{email,name,minutes,date:"YYYY-MM-DD",note,at} } }   // time tracking
     config/team       { emails:[], admins:[], clientCode, profiles:{ "a,b@gmail,com":{name,photo} } }
   PHASES (above) is only the seed used by "Import default epics & stories".
   ============================================================================== */

 doing:'<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 1.5A3.5 3.5 0 0 1 5 8.5Z" fill="currentColor"/></svg>',
 done:'<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/><path d="M3 5.2l1.4 1.4L7.2 3.8" fill="none" stroke="var(--done-bg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'};

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const byOrder=(a,b)=>cmp(a.order||"",b.order||"")||cmp(a.key||"",b.key||"");
const emailKey=e=>String(e||"").toLowerCase().replace(/\./g,",");   // Firestore field names cannot contain "."
const initials=n=>String(n||"?").split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---- fractional ordering keys --------------------------------------------------
   Keys are lowercase base-36 strings compared as plain strings. between(a,b) returns a
   key strictly between a and b ("" = open end). Only the moved card is ever rewritten. */
const AL="0123456789abcdefghijklmnopqrstuvwxyz";
function between(a,b){
  a=a||""; b=b||""; let res="", i=0;
  for(;;){
    const ca=i<a.length?AL.indexOf(a[i]):0;
    const cb=b!==""&&i<b.length?AL.indexOf(b[i]):36;
    if(cb-ca>1){ return res+AL[Math.floor((ca+cb)/2)]; }
    res+=AL[ca];
    if(cb===ca+1) b="";        // from here on only the lower bound matters
    i++;
  }
}
function seedKeys(n){ const step=Math.floor(46655/(n+1)); return Array.from({length:n},(_,i)=>((i+1)*step).toString(36).padStart(3,"0")); }

const stages=()=>(meta&&Array.isArray(meta.stages)&&meta.stages.length?meta.stages:DEFAULT_STAGES);

const stageName=id=>(stages().find(s=>s.id===id)||{}).name||id;
const liveEpics=()=>Object.values(epics||{}).filter(e=>!e.archived).sort(byOrder);
const liveStories=()=>Object.values(stories||{}).filter(s=>!s.archived);
const epicStories=eid=>liveStories().filter(s=>s.epicId===eid).sort(byOrder);
const epicStage=eid=>{ const ss=epicStories(eid); if(!ss.length) return null; return stages()[Math.min(...ss.map(s=>stageIdx(s.stage)))].id; };
const members=()=>{ const prof=(team&&team.profiles)||{}; return ((team&&team.emails)||[]).map(e=>{const p=prof[emailKey(e)]||{}; return {email:e.toLowerCase(),name:p.name||e.split("@")[0],photo:p.photo||""};}); };
const memberOf=email=>members().find(m=>m.email===(email||"").toLowerCase());
const doneId=()=>stages()[stages().length-1].id;

/* ---- time tracking helpers ------------------------------------------------------
   Entries live in stories/{id}.logs, one map key per entry, so concurrent logging never
   collides. Owner accounts are always admins; others are listed in config/team.admins. */
const isAdminEmail=e=>{ e=(e||"").toLowerCase(); return BOOTSTRAP.includes(e)||((team&&team.admins)||[]).map(x=>x.toLowerCase()).includes(e); };
const isAdmin=()=>!!user&&isAdminEmail(user.email);
const logsOf=s=>Object.entries((s&&s.logs)||{}).map(([id,l])=>({id,...l})).sort((a,b)=>cmp(b.date||"",a.date||"")||(b.at||0)-(a.at||0));
const minsOf=s=>Object.values((s&&s.logs)||{}).reduce((n,l)=>n+(+l.minutes||0),0);
const sumMin=list=>list.reduce((n,l)=>n+(+l.minutes||0),0);
const fmtMin=m=>{ m=Math.round(m||0); const h=Math.floor(m/60), r=m%60; return h&&r?`${h}h ${r}m`:h?`${h}h`:`${r}m`; };
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);   // local date
const personName=l=>{ const m=memberOf(l.email); return (m&&m.name)||l.name||l.email||"?"; };

function avatarHTML(a,size){ if(!a) return `<span class="av empty" title="Unassigned" style="--sz:${size||24}px">+</span>`;
  const m=memberOf(a.email); const gone=!m; const name=(m&&m.name)||a.name||a.email;
  return m&&m.photo?`<img class="av" src="${esc(m.photo)}" alt="" title="${esc(name)}" style="--sz:${size||24}px" referrerpolicy="no-referrer">`
    :`<span class="av ${gone?'gone':''}" title="${esc(name)}${gone?' (no longer on team)':''}" style="--sz:${size||24}px">${esc(initials(name))}</span>`; }
const barHTML=(done,doing,total)=>`<div class="bar"><i class="d" style="width:${total?done/total*100:0}%"></i><i class="p" style="width:${total?doing/total*100:0}%"></i></div>`;
function progress(list){ const d=doneId(); const done=list.filter(s=>s.stage===d).length; const doing=list.filter(s=>s.stage!==d&&s.stage!=="backlog"&&s.stage!=="todo").length; return {done,doing,total:list.length}; }

function boardHTML(){
  let h=filtersHTML()+importBanner()+`<main class="kanban">`;

  stages().forEach(st=>{
    const inStage=all.filter(s=>s.stage===st.id);
    h+=`<section class="col" data-stage="${esc(st.id)}"><div class="col-h"><h2>${esc(st.name)}</h2><span class="count mono">${inStage.filter(visible).length}</span></div><div class="col-body">`;
    eps.forEach(e=>{
      const list=inStage.filter(s=>s.epicId===e.id).sort(byOrder); if(!list.length) return;
      const shown=list.filter(visible); const p=progress(epicStories(e.id)); const key=e.id+"|"+st.id; const col=collapsed.has(key);
      h+=`<div class="grp ${col?'collapsed':''}" data-grp="${esc(e.id)}"><div class="grp-h" data-epic-h="${esc(e.id)}" data-stage="${esc(st.id)}" title="Drag to move the whole epic"><button class="tog" data-tog="${esc(key)}" aria-label="collapse">${col?'▸':'▾'}</button><span class="grp-name">${esc(e.name)}</span><span class="mono grp-n">${shown.length}</span>${barHTML(p.done,p.doing,p.total)}</div><div class="grp-b">${shown.map(cardHTML).join('')}</div></div>`;

function answersHTML(){
  const people=(answers&&answers.people)||{}; const keys=Object.keys(people).sort((a,b)=>(people[b].updatedAt||0)-(people[a].updatedAt||0));
  if(answers&&answers.vals&&Object.keys(answers.vals).length) { people["_legacy"]={vals:answers.vals,name:"(no name)",updatedAt:0}; if(!keys.includes("_legacy")) keys.push("_legacy"); }
  if(!answersPath()) return `<div class="answers"><section><div class="sh">No client access code yet</div><div class="ans"><div class="v empty">Open “Team &amp; access” and set a client access code first. Then send the code to the client with the checklist link.</div></div></section></div>`;

  let h=`<div class="filters" style="max-width:900px"><span class="fl">Submitted by</span>${keys.map(k=>`<button class="chip ${k===person?'on':''}" data-person="${esc(k)}">${esc(people[k].name||k)}</button>`).join('')}</div>`;
  const delBtn=delArm===person?`<button class="chip" data-del="${esc(person)}" style="border-color:#c0392b;background:#c0392b;color:#fff">Yes, delete ${esc(p.name||person)}'s answers</button> <button class="chip" data-delcancel="1">Cancel</button>`:`<button class="chip" data-delarm="${esc(person)}" style="color:#c0392b">Delete this submission</button>`;
  h+=`<div class="meta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${esc(p.name||person)} · last updated ${p.updatedAt?new Date(p.updatedAt).toLocaleString():'—'} ${delBtn}</div><div class="answers">`;
  SECTIONS.forEach((sec,i)=>{const done=sec.items.filter(it=>{const x=v[it.id];return Array.isArray(x)?x.length:!!(x&&String(x).trim());}).length;
    h+=`<section><div class="sh">Part ${i+1} · ${esc(sec.name)}<span class="mono">${done}/${sec.items.length}</span></div>`;
    sec.items.forEach(it=>{const x=v[it.id];const val=Array.isArray(x)?x.join(", "):(x||"");
      const others=keys.filter(k=>k!==person).map(k=>{const y=(people[k].vals||{})[it.id];const yv=Array.isArray(y)?y.join(", "):(y||"");return yv&&yv!==val?`<div class="v" style="font-size:12px;color:var(--ink-3);margin-top:4px">${esc(people[k].name||k)}: ${esc(yv)}</div>`:'';}).join('');
      h+=`<div class="ans ${it.req?'req':''}"><div class="q">${esc(it.t)}</div><div><div class="v ${val?'':'empty'}">${val?esc(val):'—'}</div>${others}</div></div>`;});
    h+=`</section>`;});
  return h+`</div>`;
}
/* ---- Time tab (admins): totals, per person, per epic, per task -------------------- */
const PERIODS=[["all","All time"],["today","Today"],["week","This week"],["lastweek","Last week"],["month","This month"],["lastmonth","Last month"]];
function periodRange(){ const d=new Date(), t=ymd(d);                  // [from,to] as local YYYY-MM-DD, "" = open
  if(timeP==="today") return [t,t];
  if(timeP==="week"||timeP==="lastweek"){ d.setDate(d.getDate()-((d.getDay()+6)%7)); if(timeP==="week") return [ymd(d),""]; const e=new Date(d); e.setDate(e.getDate()-1); d.setDate(d.getDate()-7); return [ymd(d),ymd(e)]; }
  if(timeP==="month"){ d.setDate(1); return [ymd(d),""]; }
  if(timeP==="lastmonth"){ d.setDate(0); const e=ymd(d); d.setDate(1); return [ymd(d),e]; }
  return ["",""]; }
function timeEntries(){ const [from,to]=periodRange(); const rows=[];
  Object.values(stories||{}).forEach(s=>logsOf(s).forEach(l=>{ if(from&&(l.date||"")<from) return; if(to&&(l.date||"")>to) return; if(timeWho!=="all"&&l.email!==timeWho) return; rows.push({...l,story:s}); }));
  return rows.sort((a,b)=>cmp(b.date||"",a.date||"")||(b.at||0)-(a.at||0)); }
function timeHTML(){
  if(stories===null) return `<div class="banner">Loading…</div>`;
  const rows=timeEntries(), total=sumMin(rows);
  const everyone={}; members().forEach(m=>{ everyone[m.email]=m.name; }); Object.values(stories).forEach(s=>logsOf(s).forEach(l=>{ if(!everyone[l.email]) everyone[l.email]=personName(l); }));
  const sel='style="font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-height:32px"';
  const group=(keyFn)=>{ const g={}; rows.forEach(r=>{ const k=keyFn(r); (g[k]=g[k]||[]).push(r); }); return Object.entries(g).map(([k,list])=>({k,list,min:sumMin(list)})).sort((a,b)=>b.min-a.min); };
  const byPerson=group(r=>r.email), byEpic=group(r=>r.story.epicId), byTask=group(r=>r.story.id);
  const share=m=>`<div class="bar" style="margin-top:6px"><i class="p" style="width:${total?m/total*100:0}%"></i></div>`;
  let h=`<div class="filters" style="max-width:1000px"><label class="fl" for="time-p">Period</label><select id="time-p" data-time-p ${sel}>${PERIODS.map(([id,n])=>`<option value="${id}" ${timeP===id?'selected':''}>${n}</option>`).join('')}</select>
    <label class="fl" for="time-w" style="margin-left:10px">Person</label><select id="time-w" data-time-w ${sel}><option value="all">Everyone</option>${Object.entries(everyone).map(([e,n])=>`<option value="${esc(e)}" ${timeWho===e?'selected':''}>${esc(n)}</option>`).join('')}</select><span style="flex:1"></span><button class="chip" data-csv="1" ${rows.length?'':'disabled'}>Export CSV</button></div>
    <div class="tiles"><div class="tile"><span>Total time spent</span><b class="mono">${fmtMin(total)}</b></div><div class="tile"><span>Tasks with time</span><b class="mono">${byTask.length}</b></div><div class="tile"><span>People</span><b class="mono">${byPerson.length}</b></div><div class="tile"><span>Entries</span><b class="mono">${rows.length}</b></div></div>
    <div class="answers" style="max-width:1000px">`;
  if(!rows.length) return h+`<section><div class="sh">No time logged${timeP!=="all"||timeWho!=="all"?' for this filter':' yet'}</div><div class="ans"><div class="v empty">Use “Log time” on any card on the Board. Entries show up here straight away.</div></div></section></div>`;
  h+=`<section><div class="sh">By person<span class="mono">${fmtMin(total)}</span></div>${byPerson.map(g=>`<div class="ans" style="grid-template-columns:auto 1fr auto"><span>${avatarHTML({email:g.k,name:personName(g.list[0])},22)}</span><div><div class="v">${esc(personName(g.list[0]))}</div><div class="v" style="font-size:12px;color:var(--ink-3)">${g.list.length} entr${g.list.length===1?'y':'ies'} · ${new Set(g.list.map(r=>r.story.id)).size} task(s)</div>${share(g.min)}</div><b class="mono">${fmtMin(g.min)}</b></div>`).join('')}</section>`;
  h+=`<section><div class="sh">By epic<span class="mono">${fmtMin(total)}</span></div>${byEpic.map(g=>`<div class="ans" style="grid-template-columns:1fr auto"><div><div class="v">${esc((epics&&epics[g.k]||{}).name||'(no epic)')}</div>${share(g.min)}</div><b class="mono">${fmtMin(g.min)}</b></div>`).join('')}</section>`;
  h+=`<section><div class="sh">By task<span class="mono">${fmtMin(total)}</span></div>${byTask.map(g=>{ const s=g.list[0].story; const ppl={}; g.list.forEach(r=>{ const n=personName(r); ppl[n]=(ppl[n]||0)+(+r.minutes||0); });
      return `<div class="ans ${s.archived?'archived':''}" style="grid-template-columns:auto 1fr auto auto auto"><span class="key mono">${esc(s.key)}</span><div><div class="v">${esc(s.title)}</div><div class="v" style="font-size:12px;color:var(--ink-3)">${esc((epics&&epics[s.epicId]||{}).name||'')} · ${esc(stageName(s.stage))}${s.archived?' · archived':''} · last ${esc(g.list[0].date||'')}</div><div class="v" style="font-size:12px;color:var(--ink-2)">${Object.entries(ppl).map(([n,m])=>esc(n)+' '+fmtMin(m)).join(' · ')}</div></div>${avatarHTML(s.assignee,22)}<b class="mono">${fmtMin(g.min)}</b><button class="more" data-log="${esc(s.id)}">Entries</button></div>`; }).join('')}
    <div class="ans" style="grid-template-columns:1fr auto"><b>Total</b><b class="mono">${fmtMin(total)}</b></div></section>`;
  h+=`<section><div class="sh">Latest entries<span class="mono">${Math.min(rows.length,25)} of ${rows.length}</span></div>${rows.slice(0,25).map(r=>`<div class="ans" style="grid-template-columns:auto auto 1fr auto"><span class="mono" style="font-size:12px;color:var(--ink-3)">${esc(r.date||'')}</span><span class="key mono">${esc(r.story.key)}</span><div><div class="v">${esc(personName(r))}${r.note?' — '+esc(r.note):''}</div></div><b class="mono">${fmtMin(r.minutes)}</b></div>`).join('')}</section>`;
  return h+`</div>`;
}
function exportCSV(){ const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=[["Date","Key","Task","Epic","Stage","Person","Email","Minutes","Hours","Note"].map(q).join(",")].concat(timeEntries().map(r=>[r.date,r.story.key,r.story.title,(epics&&epics[r.story.epicId]||{}).name||"",stageName(r.story.stage),personName(r),r.email,r.minutes,(r.minutes/60).toFixed(2),r.note||""].map(q).join(",")));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"})); a.download="applebox-time-"+ymd(new Date())+".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ---- Invoices tab (admins): bill logged time -------------------------------------
   board/billing   { currency, defaultRate, rates:{emailKey:rate}, taxPct, termsDays, nextNo,
                     from:{name,address,contact}, client:{name,address,email}, notes }
   board/inv-<id>  a frozen copy: { no, date, due, periodFrom, periodTo, from, client, currency,
                     lines:[{storyId,key,title,minutes,rate,amount}], entries:[…], subtotal, taxPct, tax, total, status }
   Every billed time entry gets logs.<id>.invoice = "<no>", so it is never billed twice. */
const curCode=()=>(billing&&billing.currency)||"LKR";
const money=(n,c)=>esc(c||curCode())+" "+(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const round2=n=>Math.round((+n||0)*100)/100;
const hrs=m=>(Math.round((+m||0)/60*100)/100).toFixed(2);
const invNo=n=>"INV-"+String(n||1).padStart(3,"0");
const rateFor=email=>{ const r=billing&&billing.rates&&billing.rates[emailKey(email)]; return +((r!=null&&r!=="")?r:(billing&&billing.defaultRate)||0)||0; };
const addDays=(date,n)=>{ const d=new Date(date+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
function unbilled(from,to,whoEmail){ const rows=[];
  Object.values(stories||{}).forEach(s=>logsOf(s).forEach(l=>{ if(l.invoice||!(+l.minutes>0)) return; if(from&&(l.date||"")<from) return; if(to&&(l.date||"")>to) return; if(whoEmail&&whoEmail!=="all"&&l.email!==whoEmail) return; rows.push({...l,story:s}); }));
  return rows.sort((a,b)=>cmp(a.date||"",b.date||"")||(a.at||0)-(b.at||0)); }
function buildLines(rows){ const g={};                                   // one line per task (and per rate, if people on it have different rates)
  rows.forEach(r=>{ const rate=rateFor(r.email), k=r.story.id+"|"+rate; const x=g[k]=g[k]||{storyId:r.story.id,key:r.story.key,title:r.story.title,rate,minutes:0}; x.minutes+=(+r.minutes||0); });
  const num=k=>parseInt(String(k||"").split("-")[1],10)||0;
  return Object.values(g).map(x=>({...x,amount:round2(x.minutes/60*x.rate)})).sort((a,b)=>num(a.key)-num(b.key)||b.rate-a.rate); }
const linesTotal=lines=>round2(lines.reduce((n,l)=>n+l.amount,0));

function invoicesHTML(){
  if(invoices===null||stories===null) return `<div class="banner">Loading…</div>`;
  if(invView){ const inv=invoices.find(i=>i.id===invView); if(inv) return invoiceViewHTML(inv); invView=null; }
  const ub=unbilled("","","all"), ubAmt=linesTotal(buildLines(ub)), noRate=!rateFor("")&&!Object.values((billing&&billing.rates)||{}).some(r=>+r>0);
  const list=invoices.slice().sort((a,b)=>cmp(b.date||"",a.date||"")||cmp(b.no||"",a.no||""));

async function createInvoice(d){
  const rows=unbilled(d.from,d.to,d.who); if(!rows.length) throw new Error("No unbilled time for this selection.");
  if((invoices||[]).some(i=>i.no===d.no)) throw new Error("Invoice "+d.no+" already exists.");
  const lines=buildLines(rows), subtotal=linesTotal(lines), tax=round2(subtotal*d.taxPct/100), id="inv-"+uid();
  const inv={no:d.no,date:d.date,due:d.due,periodFrom:d.from||rows[0].date,periodTo:d.to||rows[rows.length-1].date,from:(billing&&billing.from)||{},client:d.client,currency:curCode(),lines,
    entries:rows.map(r=>({storyId:r.story.id,logId:r.id,date:r.date||"",key:r.story.key,name:personName(r),note:r.note||"",minutes:+r.minutes||0})),subtotal,taxPct:d.taxPct,tax,total:round2(subtotal+tax),notes:d.notes,status:"draft",createdAt:Date.now()};
  const marks={}; rows.forEach(r=>{ (marks[r.story.id]=marks[r.story.id]||{})[r.id]={invoice:d.no}; });
  const n=parseInt(String(d.no).replace(/\D+/g,""),10)||0;
  const ops=[{op:"set",path:"board/"+id,data:inv},{op:"merge",path:"board/billing",data:{nextNo:Math.max(+((billing||{}).nextNo)||1,n)+1}},...Object.entries(marks).map(([sid,logs])=>({op:"merge",path:"stories/"+sid,data:{logs}}))];
  setConn("saving","Creating invoice…"); await S().batch(ops,who);
  rows.forEach(r=>{ const l=stories[r.story.id]&&stories[r.story.id].logs&&stories[r.story.id].logs[r.id]; if(l) l.invoice=d.no; });
  if(!invoices.some(i=>i.id===id)) invoices.push({id,...inv}); invView=id; invDelArm=false; setConn("live","Invoice "+d.no+" created");
}
async function deleteInvoice(id){ const inv=(invoices||[]).find(i=>i.id===id); if(!inv) return;
  const marks={}; (inv.entries||[]).forEach(e=>{ const l=stories[e.storyId]&&stories[e.storyId].logs&&stories[e.storyId].logs[e.logId]; if(l&&l.invoice===inv.no) (marks[e.storyId]=marks[e.storyId]||{})[e.logId]={invoice:null}; });
  const ops=[{op:"delete",path:"board/"+id},...Object.entries(marks).map(([sid,logs])=>({op:"merge",path:"stories/"+sid,data:{logs}}))];
  setConn("saving","Deleting…");
  try{ await S().batch(ops,who); Object.entries(marks).forEach(([sid,logs])=>Object.keys(logs).forEach(lid=>{ stories[sid].logs[lid].invoice=null; })); invoices=invoices.filter(i=>i.id!==id); invView=null; invDelArm=false; setConn("live","Invoice deleted · its time is unbilled again"); render(); }
  catch(e){ fail(e,"Delete failed"); }
}

/* ---- Approvals tab: directors approve a video before it goes public ----------------
   board/vid-<id> { title, description, publishAt, storyKey, status:"draft"|"review"|"published"|"cancelled",
                    createdBy:{email,name}, approvers:[email], rule:{type:"all"|"count",count}, version:n,
                    versions:{ n:{url,videoId,note,by,at} }, decisions:{ emailKey:{version,decision,comment,name,at} },
                    checklist:{k:true}, published:{url,by,at}, override:{by,at,reason}|null, history:{ id:{at,by,action,detail} } }
   Only decisions made on the current version count, so a new version restarts approval by itself.
   "Changes requested" / "Approved" are derived from the decisions (vidStatus), never stored —
   two directors deciding at the same moment cannot overwrite each other's result. */
const VID_CHECK=[["meta","Title and description are final"],["thumb","Thumbnail uploaded"],["kids","“Made for kids” is set correctly"],["rights","Music and actor rights confirmed"],["end","End screen and cards added"]];
const VID_LABEL={draft:"Draft",review:"In review",changes:"Changes requested",approved:"Approved",published:"Published",cancelled:"Cancelled"};
const myEmail=()=>((user&&user.email)||"").toLowerCase();
const myName=()=>{ const m=memberOf(myEmail()); return (m&&m.name)||who||myEmail(); };
/* Approvers are NOT team members and never open this board. Each request has a public copy at
   intake/apr-<token> (readable only with the secret link, like the client checklist). The separate
   page approve/#<token> shows that copy after Google sign-in and writes decisions.<emailKey> and
   dlog.<id> into it. The board watches the copy (mirrors[token]) and reads the decisions from there. */
let mirrors={}, unMirrors={};
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
const mirrorOf=v=>(v.token&&mirrors[v.token])||{};
const allDecisions=v=>({...(v.decisions||{}),...(mirrorOf(v).decisions||{})});
const vidMirror=v=>{ const c=vidCur(v); return {kind:"approval",title:v.title||"",description:v.description||"",publishAt:v.publishAt||"",version:v.version,url:c.url||"",videoId:c.videoId||"",note:c.note||"",
  approvers:v.approvers||[],rule:v.rule||{type:"all"},status:v.status,overridden:!!v.override,uploader:(v.createdBy&&v.createdBy.name)||""}; };
function syncMirrors(){
  (videos||[]).filter(v=>!v.token&&v.status!=="draft"&&canManage(v)).forEach(v=>{ v.token=newToken();      // requests sent before the approver page existed
    S().merge("board/"+v.id,{token:v.token},who).then(()=>S().merge("intake/apr-"+v.token,vidMirror(v),who)).catch(e=>console.error(e)); });
  const want=new Set((videos||[]).filter(v=>v.token).map(v=>v.token));
  Object.keys(unMirrors).forEach(t=>{ if(!want.has(t)){ unMirrors[t](); delete unMirrors[t]; delete mirrors[t]; } });
  want.forEach(t=>{ if(!unMirrors[t]) unMirrors[t]=S().watch("intake/apr-"+t,d=>{ mirrors[t]=d||{}; if(tab==='approvals') render(); },err=>console.error(err)); }); }
const ytId=u=>{ const m=String(u||"").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/); return m?m[1]:""; };
const vidCur=v=>(v.versions||{})[v.version]||{};
const vidDecisions=v=>(v.approvers||[]).map(e=>{ const d=allDecisions(v)[emailKey(e)]; return {email:e,d:d&&d.version===v.version?d:null}; });
const vidNeeded=v=>{ const n=(v.approvers||[]).length; return v.rule&&v.rule.type==="count"?Math.max(1,Math.min(+v.rule.count||1,n)):n; };
const vidApprovals=v=>vidDecisions(v).filter(x=>x.d&&x.d.decision==="approved").length;
function vidStatus(v){ if(v.status==="draft"||v.status==="published"||v.status==="cancelled") return v.status; if(v.override) return "approved";
  const ds=vidDecisions(v); if(ds.some(x=>x.d&&x.d.decision==="changes")) return "changes"; return ds.length&&vidApprovals(v)>=vidNeeded(v)?"approved":"review"; }
const canManage=v=>isAdmin()||(v.createdBy&&v.createdBy.email===myEmail());
const vidLink=v=>location.origin+location.pathname.replace(/[^/]*$/,"")+"approve/#"+(v.token||"");
const vidWhen=s=>s?String(s).replace("T"," "):"";
const vidMsg=v=>`Please review “${v.title}” for the Apple Box YouTube channel${v.publishAt?` (planned publish: ${vidWhen(v.publishAt)})`:''}. Open this link, sign in with your Google (Gmail) account, watch the video and approve or reject it with a comment: ${vidLink(v)}`;
const stPill=st=>`<span class="pri st ${st}">${VID_LABEL[st]||st}</span>`;
function deepMerge(t,p){ Object.entries(p).forEach(([k,x])=>{ if(x&&typeof x==="object"&&!Array.isArray(x)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k])) deepMerge(t[k],x); else t[k]=x; }); return t; }
async function vidSave(id,patch,action,detail){                       // optimistic; every change also writes one history entry
  const full=JSON.parse(JSON.stringify({...patch,history:{["h"+uid()]:{at:Date.now(),by:myName(),email:myEmail(),action,detail:detail||""}}}));
  const v=(videos||[]).find(x=>x.id===id); if(v) deepMerge(v,JSON.parse(JSON.stringify(full))); else videos.push({id,...JSON.parse(JSON.stringify(full))});
  const cur=videos.find(x=>x.id===id); if(!cur.token){ cur.token=full.token=newToken(); }        // requests made before the approver page existed
  render(); setConn("saving","Saving…");
  try{ await S().merge("board/"+id,full,who); if(cur.status!=="draft") await S().merge("intake/apr-"+cur.token,vidMirror(cur),who); syncMirrors(); setConn("live","Saved · live"); }catch(e){ fail(e,"Save failed"); } }

    ${!mine.length?`<section><div class="sh">No approval requests yet</div><div class="ans"><div class="v empty">Create one with “+ New approval request”.</div></div></section>`:''}</div>`;

  return h; }

function render(){
  if(drag) return;                                   // never re-render mid-drag
  const root=document.getElementById('root');
  if(!user){ root.innerHTML=loginHTML(authMsg); return; }
  if(!team){ root.innerHTML=loginHTML(teamErr||"Loading team list…"); return; }
  if(!isTeam()){ root.innerHTML=loginHTML(`${user.email} is not on the team list. Ask Danika to add you under “Team & access”.`); return; }
  if((tab==='time'||tab==='invoices')&&!isAdmin()) tab='board';
  if(tab==='approvals'&&vidView&&videos){ const v=videos.find(x=>x.id===vidView), pl=document.querySelector('[data-player]');   // keep the video playing: refresh only the text around it
    if(v&&pl&&pl.dataset.player===v.id+"|"+vidCur(v).videoId){ document.getElementById('vid-info').innerHTML=vidInfoHTML(v); document.getElementById('vid-panel').innerHTML=vidPanelHTML(v);
      const tmp=document.createElement('div'); tmp.innerHTML=header(); root.querySelector('nav.tabs').replaceWith(tmp.querySelector('nav.tabs')); if(document.activeElement.id!=='who') root.querySelector('header.top').replaceWith(tmp.querySelector('header.top'));
      return; } }
  root.innerHTML=header()+(tab==='board'?boardHTML():tab==='epics'?epicsHTML():tab==='time'?timeHTML():tab==='invoices'?invoicesHTML():tab==='approvals'?approvalsHTML():tab==='team'?teamHTML():answersHTML());
}

/* ---- writes (optimistic: update local copy, render, then save; revert on error) -- */
async function saveStory(id,patch,label){
  const prev={...stories[id]}; Object.assign(stories[id],patch); render(); setConn("saving","Saving…");
  try{ await S().merge("stories/"+id,patch,who); setConn("live","Saved · live"); }
  catch(e){ stories[id]=prev; render(); fail(e,label||"Save failed"); }
}
async function addLog(storyId,entry){ const s=stories[storyId]; if(!s) return; const lid="t"+uid();
  s.logs={...(s.logs||{}),[lid]:entry}; render(); timeModal(storyId); setConn("saving","Saving…");
  try{ await S().merge("stories/"+storyId,{logs:{[lid]:entry}},who); setConn("live",`Logged ${fmtMin(entry.minutes)} on ${s.key}`); }

function moveStory(id,stageId,prevId,nextId){

  let order;

    const mapStage={todo:"todo",doing:"doing",done:"done"};

/* ---- drag and drop (pointer events; works with mouse, pen and touch) ----------
   Mouse: drag starts after 6px of movement. Touch: after a 300ms long-press
   (so normal scrolling keeps working). A ghost follows the pointer, a placeholder
   marks the drop slot. Epic headers can be dragged too (bulk move, with confirm). */
function startDrag(kind,id,x,y,srcEl){
  const ghost=srcEl.cloneNode(true); ghost.className+=" ghost"; ghost.style.width=srcEl.offsetWidth+"px"; document.body.appendChild(ghost);
  const ph=document.createElement("div"); ph.className="ph"; ph.style.height=(kind==="story"?srcEl.offsetHeight:44)+"px";
  drag={kind,id,ghost,ph,srcEl,stage:null,prev:null,next:null,epicId:kind==="story"?stories[id].epicId:id};
  srcEl.classList.add("dragging"); document.body.classList.add("dragging-any"); moveGhost(x,y);

function moveGhost(x,y){ drag.ghost.style.transform=`translate(${x-20}px,${y-16}px)`; }
function onDragMove(x,y){
  moveGhost(x,y);
  drag.ghost.style.display="none"; const el=document.elementFromPoint(x,y); drag.ghost.style.display="";

  drag.stage=col.dataset.stage; const body=col.querySelector(".col-body");
  if(drag.kind==="epic"){ col.classList.add("drop"); document.querySelectorAll(".col.drop").forEach(c=>{ if(c!==col) c.classList.remove("drop"); }); return; }
  // story: only positions inside its own epic group are meaningful
  let grp=[...body.querySelectorAll(".grp")].find(g=>g.dataset.grp===drag.epicId);
  if(!grp){ if(drag.ph.parentNode!==body) body.appendChild(drag.ph); drag.prev=null; drag.next=null; return; }
  const cards=[...grp.querySelectorAll(".card")].filter(c=>c!==drag.srcEl);
  drag.ph.style.display="none";                       // measure without the placeholder shifting things
  let next=null; for(const c of cards){ const r=c.getBoundingClientRect(); if(y<r.top+r.height/2){ next=c; break; } }
  drag.ph.style.display="";
  const gb=grp.querySelector(".grp-b"); if(next) gb.insertBefore(drag.ph,next); else gb.appendChild(drag.ph);
  drag.next=next?next.dataset.card:null; const prevEl=drag.ph.previousElementSibling; drag.prev=prevEl&&prevEl.classList.contains("card")&&prevEl!==drag.srcEl?prevEl.dataset.card:null;
  if(drag.prev===null){ const ps=[...gb.children]; const i=ps.indexOf(drag.ph); for(let k=i-1;k>=0;k--){ const c=ps[k]; if(c.classList.contains("card")&&c!==drag.srcEl){ drag.prev=c.dataset.card; break; } } }
}
function endDrag(commit){
  const d=drag; drag=null; d.ghost.remove(); d.ph.remove(); d.srcEl.classList.remove("dragging"); document.body.classList.remove("dragging-any"); document.querySelectorAll(".col.drop").forEach(c=>c.classList.remove("drop"));
  if(commit&&d.stage){ if(d.kind==="story") moveStory(d.id,d.stage,d.prev,d.next); else confirmEpicMove(d.id,d.stage); }
  render();
}
let pend=null; // pending press before a drag starts
document.addEventListener("pointerdown",e=>{
  if(e.button!==0||drag) return; if(e.target.closest("button,input,select,textarea,a,.detail")) return;
  const card=e.target.closest(".card"), eh=e.target.closest(".grp-h"); if(!card&&!eh) return;
  const kind=card?"story":"epic", id=card?card.dataset.card:eh.dataset.epicH, el=card||eh;
  pend={kind,id,el,x:e.clientX,y:e.clientY,touch:e.pointerType!=="mouse",timer:null};
  if(pend.touch){ pend.timer=setTimeout(()=>{ if(pend){ startDrag(pend.kind,pend.id,pend.x,pend.y,pend.el); if(navigator.vibrate) navigator.vibrate(15); } },300); }

    if(!canManage(old)) return; const c=vidCur(old), content=old.title!==base.title||(old.description||"")!==base.description||c.videoId!==videoId;
    if(old.status==="draft"||!content) await vidSave(id,{...base,versions:{[old.version]:{...c,url,videoId}}},"edited the request");
    else await vidSave(id,{...base,version:old.version+1,versions:{[old.version+1]:{...ver,note:"Title, description or link changed"}},override:null},"changed the content","version "+(old.version+1)+" · approvals start again");
    return; }
  if(f.dataset.vidVersionForm||f.dataset.vidPublishForm||f.dataset.vidOverrideForm){ const vd=(videos||[]).find(x=>x.id===vidView), err=f.querySelector('[data-vid-err]'); if(!vd) return;
    if(f.dataset.vidVersionForm){ if(!canManage(vd)) return; const url=v("url"), videoId=ytId(url); if(!videoId){ err.textContent="That does not look like a YouTube link."; return; } if(videoId===vidCur(vd).videoId){ err.textContent="This is the same video as the current version."; return; }
      closeModal(); await vidSave(vd.id,{version:vd.version+1,versions:{[vd.version+1]:{url,videoId,note:v("note"),by:myName(),at:Date.now()}},status:"review",override:null},"added a new version","version "+(vd.version+1)+(v("note")?" · "+v("note"):"")+" · approvals start again"); return; }
    if(f.dataset.vidPublishForm){ if(!canManage(vd)||vidStatus(vd)!=="approved") return; closeModal(); await vidSave(vd.id,{status:"published",published:{url:v("url"),by:myName(),at:Date.now()}},"marked it as published",v("url")); return; }
    if(f.dataset.vidOverrideForm){ if(!isAdmin()) return; const reason=v("reason"); if(!reason){ err.textContent="A reason is required."; return; } closeModal(); await vidSave(vd.id,{override:{by:myName(),at:Date.now(),reason}},"approved by override",reason); return; }
  }
  if(f.dataset.invoiceForm){ if(!isAdmin()) return; const err=f.querySelector('[data-inv-err]');
    try{ await createInvoice({no:v("no"),date:v("date"),due:v("due"),from:v("from"),to:v("to"),who:v("who")||"all",taxPct:parseFloat(v("taxPct"))||0,notes:v("notes"),client:{name:v("cname"),email:v("cemail"),address:v("caddr")}}); closeModal(); render(); window.scrollTo(0,0); }
    catch(e2){ console.error(e2); err.textContent=e2.code||e2.message; setConn("err","Invoice not created"); } return; }
  if(f.dataset.billingForm){ if(!isAdmin()) return; const rates={}; members().forEach(m=>{ const x=v("rate:"+m.email); rates[emailKey(m.email)]=x===""?"":(parseFloat(x)||0); });
    const data={currency:(v("currency")||"LKR").toUpperCase(),defaultRate:parseFloat(v("defaultRate"))||0,taxPct:parseFloat(v("taxPct"))||0,termsDays:parseInt(v("termsDays"),10)||0,notes:v("notes"),rates,from:{name:v("fname"),contact:v("fcontact"),address:v("faddr")},client:{name:v("cname"),email:v("cemail"),address:v("caddr")}};
    billing={...(billing||{}),...data}; closeModal(); render(); setConn("saving","Saving…"); S().merge("board/billing",data,who).then(()=>setConn("live","Saved · live")).catch(e2=>fail(e2,"Save failed")); return; }
  if(f.dataset.epicForm!==undefined){ const data={name:v("name"),goal:v("goal"),role:v("role")}; closeModal(); if(f.dataset.epicForm){ const id=f.dataset.epicForm; Object.assign(epics[id],data); render(); S().merge("epics/"+id,data,who).catch(err=>fail(err,"Save failed")); } else await createEpic(data); return; }
  if(f.dataset.addEmail){ const em=(f.querySelector('input').value||"").trim().toLowerCase(); if(em&&!team.emails.includes(em)) await saveTeam({emails:[...team.emails,em]}); return; }
  if(f.dataset.setCode){ const c=codeSlug(f.querySelector('input').value); if(c.length<6) return; teamBusy="Saving…"; render();
    try{ await S().merge("intake/client-"+c,{created:Date.now()},user.email); await S().merge("config/team",{clientCode:c},user.email); teamBusy=""; }catch(err){ teamBusy="Save failed: "+(err.code||err.message); render(); } return; }
  if(f.dataset.renameStage){ const st=stages().map(s=>s.id===f.dataset.renameStage?{...s,name:f.querySelector('input').value.trim()||s.name}:s); meta={...(meta||{}),stages:st}; render(); saveMeta({stages:st}); return; }
  if(f.dataset.addStage){ const name=f.querySelector('input').value.trim(); if(!name) return; const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||uid(); if(stages().some(s=>s.id===id)){ setConn("err","A stage with that name exists"); return; }
    const st=[...stages()]; st.splice(st.length-1,0,{id,name}); meta={...(meta||{}),stages:st}; render(); saveMeta({stages:st}); return; }   // insert before Done
});
document.addEventListener('change',e=>{
  if(e.target.id==='who'){who=e.target.value.trim();localStorage.setItem('ab-who',who);}
  if(e.target.matches('[data-show-archived]')){ showArchived=e.target.checked; render(); }
  if(e.target.matches('[data-time-p]')){ timeP=e.target.value; render(); }
  if(e.target.matches('[data-time-w]')){ timeWho=e.target.value; render(); }
});
document.addEventListener('input',e=>{ const f=e.target.closest&&e.target.closest('[data-invoice-form]'); if(f) invSummary(f); });

/* ---- boot: auth → team → live data ------------------------------------------------ */
let profileSynced=false, unTeam=null, unMeta=null, unEpics=null, unStories=null, unAns=null, unBoard=null, lastAnsPath=null;
function stopAll(){ [unMeta,unEpics,unStories,unAns,unBoard].forEach(u=>u&&u()); unMeta=unEpics=unStories=unAns=unBoard=null; Object.values(unMirrors).forEach(u=>u()); unMirrors={}; mirrors={}; billing=null; invoices=null; videos=null; meta=null; epics=null; stories=null; answers=null; lastAnsPath=null; }
function startData(){
  if(unMeta) return;
  const S_=S(); const onErr=err=>{ setConn("err","Connection error: "+err.code); };
  unMeta=S_.watch("board/meta",d=>{ meta=d||{}; render(); },onErr);
  unBoard=S_.watchCollection("board",list=>{ billing=list.find(d=>d.id==="billing")||{}; invoices=list.filter(d=>d.id.startsWith("inv-")); videos=list.filter(d=>d.id.startsWith("vid-")); syncMirrors(); if(tab==='invoices'||tab==='approvals') render(); },onErr);
  unEpics=S_.watchCollection("epics",list=>{ epics=Object.fromEntries(list.map(e=>[e.id,e])); render(); },onErr);
  unStories=S_.watchCollection("stories",list=>{ stories=Object.fromEntries(list.map(s=>[s.id,s])); const last=list.map(s=>s.updatedBy).filter(Boolean).pop(); if(conn!=="saving"){ conn="live"; connMsg=last?`Live · last change by ${last}`:"Live"; } render(); },onErr);
}
function watchAnswers(){ if(unAns){unAns();unAns=null;} answers=null; person=null; const p=answersPath(); if(!p){ if(tab==='answers') render(); return; }
  unAns=S().watch(p,d=>{ answers=d; if(tab==='answers') render(); },err=>console.error(err)); }
async function bootstrapTeam(){ if(!BOOTSTRAP.includes((user.email||"").toLowerCase())) return false;
  try{ await S().merge("config/team",{emails:[user.email.toLowerCase()],clientCode:""},user.email); return true; }catch(e){ console.error("bootstrap",e); return false; } }
// deep link from the share message: …/#v=vid-abc opens that approval request after sign-in
function readHash(){ const m=location.hash.match(/^#v=(vid-[a-z0-9]+)$/); if(m){ tab='approvals'; vidView=m[1]; vidArm=false; return true; } return false; }
readHash(); window.addEventListener('hashchange',()=>{ if(readHash()) render(); });
document.addEventListener('applebox-store-ready',()=>{
  const S_=S(); if(!S_.configured){conn="err";connMsg="Not connected";user=null;render();return;}
  S_.onAuth(async u=>{
    user=u||null; team=null; teamErr=""; stopAll(); if(unTeam){unTeam();unTeam=null;} render(); if(!user) return;
    if(!who&&user.displayName){who=user.displayName;localStorage.setItem('ab-who',who);}
    const startTeamWatch=()=>{ unTeam=S_.watch("config/team",d=>{
        team=d||{emails:[],clientCode:""}; teamErr="";
        if(!isTeam()){ stopAll(); render(); return; }
        // remember my display name/photo so teammates see them on cards
        const k=emailKey(user.email), prof=(team.profiles||{})[k]||{}; if(!profileSynced&&user.displayName&&(prof.name!==user.displayName||prof.photo!==(user.photoURL||""))){ profileSynced=true; S_.merge("config/team",{profiles:{[k]:{name:user.displayName,photo:user.photoURL||""}}},user.email).catch(()=>{}); }
        startData(); if(answersPath()!==lastAnsPath){ lastAnsPath=answersPath(); watchAnswers(); } render();
      },async err=>{
        if(err.code==='permission-denied'){ let ok=false; if(BOOTSTRAP.includes((user.email||"").toLowerCase())) ok=await bootstrapTeam(); if(ok){ if(unTeam) unTeam(); startTeamWatch(); return; } team={emails:[],clientCode:""}; render(); return; }
        teamErr="Connection error: "+err.code; render();
      }); };
    startTeamWatch();
  });
});
render();
setTimeout(()=>{ if(conn==='off'){ conn='err'; connMsg='Database script did not load — check internet / firebase-config.js'; updStatus(); } },8000);
</script>
