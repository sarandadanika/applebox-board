<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Box · Launch Board (internal)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect x='40' y='62' width='120' height='108' rx='10' fill='%23e6332a'/%3E%3Cpolygon points='84,88 84,144 132,116' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.summary{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:6px;min-width:220px}
.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.meter-label b{color:var(--ink);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--done)} .bar .p{background:var(--doing)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .ld::before{background:var(--done)} .legend .lp::before{background:var(--doing)} .legend .lt::before{background:var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.who input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:150px}
.filters{max-width:1600px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .fl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12px;color:var(--ink-2);background:var(--surface);min-height:28px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.col-h{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.col-h .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h h2{margin:0;font-size:14px;font-weight:600}
.col-h .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.col-h .count{font-size:12px;color:var(--ink-2)}
.col-h .bar{height:4px}
.task{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.key{font-size:11px;color:var(--accent);font-weight:500}
.pri{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}
.pri.Highest{border-color:var(--accent);color:var(--accent)} .pri.High{border-color:var(--doing);color:var(--doing)}
.st{width:74px;height:26px;border-radius:13px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--todo-bg);color:var(--ink-2);flex-shrink:0}
.st svg{width:10px;height:10px}
.task.doing .st{background:var(--doing-bg);color:var(--doing)}
.task.done .st{background:var(--done-bg);color:var(--done)}
.t{font-size:13.5px;line-height:1.4;font-weight:600}
.oname{font-size:12px;color:var(--ink-2)}
.more{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;align-self:flex-start;min-height:24px}
.detail{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;line-height:1.45;padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-top:4px}
.detail dt{color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:2px}
.detail dd{margin:0}
.detail ul{margin:0;padding-left:16px}
.detail input{width:100%;font:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0}
.task[data-open="0"] .detail{display:none}
/* answers tab */
.answers{max-width:900px;margin:0 auto}
.answers section{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.answers .sh{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between}
.answers .sh span{color:var(--ink-3);font-weight:500;font-size:12px}
.ans{display:grid;grid-template-columns:minmax(200px,2fr) 3fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.ans:last-child{border-bottom:0}
.ans .q{color:var(--ink-2)} .ans .v{white-space:pre-wrap} .ans .v.empty{color:var(--ink-3);font-style:italic}
.ans.req .q::after{content:" *";color:var(--accent)}
.meta{max-width:900px;margin:0 auto 12px;font-size:12px;color:var(--ink-3)}
@media (max-width:640px){.ans{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="firebase-config.js"></script>
<script type="module" src="store.js"></script>
<script>
const PHASES=[{"id":"e1","name":"Agree the basics","owner":"Client (decision maker)","goal":"Before anything is built, the client and the project lead agree on the name, the content, the language and who owns the accounts.","stories":[{"key":"AB-1","title":"Confirm the channel name and handle","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to confirm in writing that the channel is called Apple Box and the handle is @appleboxlk on all platforms","so":"the team can register the same name everywhere without going back and forth","details":"The plain handle @applebox is already taken on YouTube, so we use @appleboxlk. The display name people see stays \"Apple Box\".","ac":["Client replies by email or message: \"Apple Box / @appleboxlk approved\".","Handle is written the same way in all documents."]},{"key":"AB-2","title":"Describe the content the channel will make","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to explain what kind of programmes we will publish (short movies, news, talk shows, live streams, etc.)","so":"the team designs the brand, the channel layout and the posting plan around real content","details":"Think of it like a TV guide: what shows will exist, how long they are, how often they come out. Share 3 to 5 example channels you like.","ac":["A short written list of show types with a one-line description each.","Links to 3–5 example channels."]},{"key":"AB-3","title":"Decide the languages","owner":"Client (decision maker)","priority":"High","as":"the client","want":"to decide whether content, captions and channel text are in Sinhala, Tamil, English or a mix","so":"bios, descriptions and subtitles are prepared correctly from day one","details":"This affects the channel description, video titles, hashtags and thumbnails.","ac":["Languages chosen for: (1) videos, (2) titles and descriptions, (3) replies to comments."]},{"key":"AB-4","title":"Decide who owns the accounts","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"all channels to be created under a company email address that belongs to the business, not to one person","so":"the channel is never lost if a staff member leaves or a personal phone is lost","details":"The project lead will create the accounts but the client company keeps ownership. The client names who will have admin access.","ac":["Company email address provided (or agreed to create one).","List of people who get admin access."]},{"key":"AB-5","title":"Agree what each side delivers","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a simple written agreement on what I deliver and what the client provides","so":"there are no surprises about videos, scripts, tools or advertising budget","details":"Example: the team sets up channels, brand and posting system; the client provides finished videos, actors' permissions and any ad budget.","ac":["One-page scope note sent to and accepted by the client."]}]},{"id":"e2","name":"Brand kit","owner":"Designer","goal":"Everything that makes Apple Box look like one channel everywhere: logo, banners, intro animation and templates.","stories":[{"key":"AB-6","title":"Choose the final logo","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to pick one of the four logo options (or ask for a change)","so":"the designer can produce the final files","details":"Options: A Crate, B Open Box with play button, C AB Cube, D Wordmark. None use an apple fruit, to avoid problems with Apple Inc.","ac":["One option chosen, with any colour or text changes noted."]},{"key":"AB-7","title":"Produce the logo files","owner":"Designer","priority":"High","as":"the designer","want":"to deliver the logo in every size and colour the platforms need","so":"the same logo can be used on YouTube, Facebook, Instagram, TikTok and in videos","details":"Needed: square profile picture, horizontal logo, white version, black version. Formats: PNG (for uploading) and SVG (for printing and video).","ac":["Files delivered in a shared folder named Brand / Logo.","Profile picture looks clear at small size (test at 48 px)."]},{"key":"AB-8","title":"Design the channel banners","owner":"Designer","priority":"High","as":"the designer","want":"to design the large header images for YouTube and Facebook","so":"the channel pages look professional from the first visit","details":"YouTube banner: 2560 × 1440 px (keep the important part in the centre 1546 × 423 px, because phones crop it). Facebook cover: 820 × 312 px. TikTok and Instagram only use the profile picture.","ac":["YouTube and Facebook banners delivered and checked on a phone and a computer."]},{"key":"AB-9","title":"Create the animated logo intro and outro","owner":"Video editor","priority":"Medium","as":"the video editor","want":"a 3–5 second animated logo to put at the start of every video, and an end-screen design","so":"every video is recognisable as Apple Box","details":"A ready-made prompt for AI video tools is available from the project lead. The end screen needs space for \"next video\" and \"subscribe\" buttons.","ac":["Intro delivered as MP4 (1920×1080 and 1080×1080).","Outro template delivered with 20 seconds of space for YouTube end-screen elements."]},{"key":"AB-10","title":"Create thumbnail and title templates","owner":"Designer","priority":"Medium","as":"the designer","want":"a reusable thumbnail design (1280 × 720 px) and an on-screen title style","so":"the editor can make new thumbnails quickly and they all look like one channel","details":"The template should have a place for a big title (max 4–5 words), a photo, and the Apple Box logo.","ac":["Editable template (Canva, Photoshop or Figma) shared with the editor.","Two example thumbnails made from it."]},{"key":"AB-11","title":"Write a one-page brand guide","owner":"Designer","priority":"Low","as":"the designer","want":"a single page showing the colours, fonts, logo rules and tone of voice","so":"anyone who joins later makes things that match","details":"Keep it simple: colour codes, font names, \"do and don't\" logo examples, and three words that describe how Apple Box speaks.","ac":["PDF shared in the Brand folder."]}]},{"id":"e3","name":"Account setup","owner":"Project lead (Danika)","goal":"Create and secure the four channels and connect them to each other.","stories":[{"key":"AB-12","title":"Create a shared company Google account","owner":"Project lead (Danika)","priority":"Highest","as":"the project lead","want":"to create one Google account for Apple Box (for example applebox.media@gmail.com) with security switched on","so":"YouTube and the other tools have one safe home that the company owns","details":"Security = 2-step verification (a code on a phone when signing in), plus a recovery phone number and a recovery email belonging to the client.","ac":["Account created with 2-step verification on.","Recovery phone and email set to the client's details."]},{"key":"AB-13","title":"Store all logins in a shared password manager","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"every channel login kept in a password manager shared with the client","so":"no password is on a piece of paper or in a chat, and the client can always get in","details":"Free options: Bitwarden or 1Password family plan. Also store the 2-step backup codes.","ac":["All four platform logins plus the Google account saved.","Client has confirmed they can open the vault."]},{"key":"AB-14","title":"Set up the YouTube channel","owner":"Project lead (Danika)","priority":"Highest","as":"the project lead","want":"the YouTube channel fully set up and verified","so":"we can upload long videos, use custom thumbnails, and go live","details":"Includes: handle @appleboxlk, logo, banner, description, links, a short channel trailer, and phone verification. Live streaming is switched on 24 hours after it is requested, so do this early.","ac":["Channel page complete (logo, banner, description, links).","Account verified; custom thumbnails, long uploads and live streaming available.","Shorts and Premieres tested once."]},{"key":"AB-15","title":"Set up the Facebook Page","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a Facebook Page for Apple Box with the right category and full details","so":"Facebook shows us as a media channel and lets us post Reels and videos","details":"Category: \"Media/News Company\" or \"TV Channel\". Fill in About, website/links, email. Turn on Reels.","ac":["Page published with logo, cover, About text and links.","At least two people from the client side added as admins."]},{"key":"AB-16","title":"Set up the Instagram account","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"an Instagram professional account connected to the Facebook Page","so":"posts, Reels and messages can be managed together with Facebook","details":"Choose \"Creator\" or \"Business\" account type. Connect it to the Page in Meta Business Suite.","ac":["Account created, bio and logo added.","Connected to the Facebook Page (visible in Meta Business Suite)."]},{"key":"AB-17","title":"Set up the TikTok account","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"a TikTok Business account with links to our other channels","so":"short clips reach a younger audience and send people to YouTube","details":"Switch to Business account in settings so we get statistics and can add a website link. Add the YouTube and Instagram links in the profile.","ac":["Business account active; logo, bio and links added."]},{"key":"AB-18","title":"Connect Facebook and Instagram in Meta Business Suite","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"to manage Facebook and Instagram from one screen","so":"one post can go to both and all messages and comments arrive in one inbox","details":"Meta Business Suite is free. It also lets us schedule posts in advance.","ac":["Both accounts visible in Business Suite.","One test post published to both from Business Suite."]},{"key":"AB-19","title":"Link all four profiles to each other","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"each profile to show links to the other three","so":"a viewer who finds us on one platform can follow us everywhere","details":"YouTube: Customisation → Links. Facebook: About → Websites and social links. Instagram and TikTok: the link field in the profile.","ac":["Every profile has links to the other three, checked by clicking each one."]},{"key":"AB-20","title":"Write the bios and pin a welcome post","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"the same short introduction text on every platform and a pinned \"Welcome to Apple Box\" post","so":"new visitors immediately understand what the channel is","details":"Bio: one sentence about what we publish, one about when (\"New short movie every Friday\"), and a link. Adjust length per platform (Instagram 150 characters, TikTok 80).","ac":["Bios live on all four platforms in the agreed languages.","Welcome post pinned on YouTube (community post or trailer), Facebook, Instagram and TikTok."]}]},{"id":"e4","name":"Content system","owner":"Content / video team","goal":"A simple routine so the channel publishes regularly, like a TV schedule.","stories":[{"key":"AB-21","title":"Define the shows and a fixed schedule","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to decide the programme list and when each show is released","so":"viewers know when to come back, just like a TV timetable","details":"Example: short movie every Friday evening, one short clip every day, a behind-the-scenes post on Sundays. Fewer shows done regularly beat many shows done sometimes.","ac":["Written schedule: show name, format, length, release day and time."]},{"key":"AB-22","title":"Set up the content calendar","owner":"Social media manager","priority":"High","as":"the social media manager","want":"a shared calendar (Google Sheet or Notion) listing every planned post","so":"everyone can see what is coming and nothing is forgotten","details":"Columns: date, platform, title, format (movie / short clip / poster), status (idea, filming, editing, ready, published), owner.","ac":["Calendar created and shared with the client and team.","First month filled in."]},{"key":"AB-23","title":"Create the shared folder structure","owner":"Project lead (Danika)","priority":"High","as":"the project lead","want":"one shared Google Drive with clear folders","so":"files are easy to find and nothing is lost on someone's laptop","details":"Folders: 01 Raw footage / 02 Edited / 03 Thumbnails / 04 Published / Brand.","ac":["Drive created under the company account and shared with the team."]},{"key":"AB-24","title":"Create YouTube playlists for each show","owner":"Social media manager","priority":"Low","as":"the social media manager","want":"a playlist per show or series","so":"viewers can watch a whole series in order and the channel page looks organised","details":"Add playlists to the channel home page sections.","ac":["One playlist per show, shown on the channel home page."]},{"key":"AB-25","title":"Prepare 5–10 pieces of content before launch","owner":"Content / video team","priority":"Highest","as":"the content team","want":"a stock of finished videos and clips ready before the channel goes public","so":"the first weeks are not empty and the schedule can be kept","details":"For example: channel trailer, 2 short movies, 5 short vertical clips, 3 poster images.","ac":["Finished files uploaded to 04 Published folder with titles and descriptions."]},{"key":"AB-26","title":"Write the standard descriptions and hashtags","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"a ready text template for each platform","so":"every post has the right links, hashtags and credits without retyping","details":"YouTube description: summary, credits, links to all channels, copyright line. Instagram/TikTok: short caption plus 5–10 hashtags. Facebook: short text plus link.","ac":["Template document saved in the Brand folder."]},{"key":"AB-27","title":"Define the repurposing flow","owner":"Video editor","priority":"High","as":"the video editor","want":"a fixed list of what to cut from every short movie","so":"one film becomes a week of content on all platforms","details":"From each movie: a 30–60 s trailer (YouTube Shorts, Reels, TikTok), 2–3 vertical clips of the best moments, a poster image and 3 still photos for Facebook and Instagram.","ac":["Checklist written and used for the first movie."]},{"key":"AB-28","title":"Choose and connect a scheduling tool","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"one tool where posts for all four platforms can be scheduled in advance","so":"posts go out on time even on weekends and holidays","details":"Metricool or Buffer (free plans are enough to start). Connect all four accounts.","ac":["Tool connected to all four accounts; one scheduled test post delivered correctly."]}]},{"id":"e5","name":"Legal and monetisation","owner":"Client (decision maker)","goal":"Protect the channel from copyright problems and prepare to earn money.","stories":[{"key":"AB-29","title":"Confirm rights to music, footage and actors","owner":"Client (decision maker)","priority":"Highest","as":"the client","want":"to confirm we have permission for all music, video clips and people appearing in our movies","so":"the channel does not receive copyright strikes, which can remove videos or close the channel","details":"Each actor signs a simple release form. Music must be original, licensed, or royalty-free. Keep copies of licences in the Drive.","ac":["Signed release forms for all actors in the first movies.","Music source recorded for every film."]},{"key":"AB-30","title":"Use only licensed or royalty-free music","owner":"Video editor","priority":"High","as":"the video editor","want":"a trusted list of music sources","so":"no video is muted or claimed by a music company","details":"Free: YouTube Audio Library. Paid: Epidemic Sound, Artlist. Never use songs from Spotify or films.","ac":["Music source list saved in the Brand folder and followed on every edit."]},{"key":"AB-31","title":"Add a copyright notice and contact email","owner":"Social media manager","priority":"Low","as":"the social media manager","want":"a copyright line and a business contact email on every channel","so":"our own work is protected and sponsors can reach us","details":"Example: \"© Apple Box. All rights reserved. Business enquiries: hello@…\"","ac":["Present in the YouTube About section and all bios."]},{"key":"AB-32","title":"Prepare for monetisation","owner":"Project lead (Danika)","priority":"Medium","as":"the project lead","want":"to know the earning rules of each platform and make sure payments go to the client","so":"the client is ready to apply as soon as the channel qualifies","details":"YouTube Partner Program needs 1,000 subscribers and 4,000 public watch hours in 12 months, or 10 million Shorts views in 90 days. Facebook and TikTok have their own rules. The AdSense (payment) account must be in the client's name.","ac":["One-page note of the rules shared with the client.","Client's AdSense account planned (name, bank, tax details)."]}]},{"id":"e6","name":"Launch","owner":"Social media manager","goal":"Open the channel to the public with enough content and a push in the first days.","stories":[{"key":"AB-33","title":"Soft launch","owner":"Social media manager","priority":"High","as":"the social media manager","want":"to publish the channel trailer and the first three videos quietly","so":"we can check everything works before we tell the world","details":"Check: thumbnails, titles, descriptions, links, playback on phone.","ac":["Trailer and three videos live on YouTube; issues fixed."]},{"key":"AB-34","title":"Launch day on all platforms","owner":"Social media manager","priority":"Highest","as":"the social media manager","want":"a launch post on all four platforms on the same day, with a YouTube Premiere for the first short movie","so":"the first movie gets attention on every platform at once","details":"A Premiere shows the movie at a set time with a live chat, like a TV première.","ac":["Launch posts published on all four platforms.","Premiere scheduled and announced at least 3 days before."]},{"key":"AB-35","title":"Ask the team, cast and friends to share","owner":"Client (decision maker)","priority":"High","as":"the client","want":"everyone connected to the project to subscribe and share in the first 48 hours","so":"the platforms see early activity and show the channel to more people","details":"Send a short message with the four links and one sentence to copy-paste.","ac":["Message sent to the cast, crew and company staff."]},{"key":"AB-36","title":"Run a small boosted post","owner":"Social media manager","priority":"Low","as":"the social media manager","want":"to spend a small budget promoting the launch post to people in Sri Lanka","so":"the launch reaches beyond our own contacts","details":"Even LKR 5,000–10,000 on Facebook/Instagram helps. Target: Sri Lanka, age and interests matching the content.","ac":["Budget approved by the client; boosted post running for the launch week."]}]},{"id":"e7","name":"Running the channel","owner":"Social media manager","goal":"The weekly routine that keeps the channel growing.","stories":[{"key":"AB-37","title":"Post on schedule and reply to comments","owner":"Social media manager","priority":"High","as":"the social media manager","want":"to publish on the agreed days and reply to comments within the first hour after each upload","so":"viewers feel heard and the platforms promote our videos more","details":"The first hour after upload matters most for reach.","ac":["Schedule kept each week; comments answered on every new upload."]},{"key":"AB-38","title":"Weekly performance check","owner":"Social media manager","priority":"Medium","as":"the social media manager","want":"to look at YouTube Studio and Meta Insights once a week","so":"we learn what viewers like and make more of it","details":"Look at: views, watch time, which clips did best, where viewers stopped watching.","ac":["Short weekly note (5 lines) added to the content calendar."]},{"key":"AB-39","title":"Monthly report to the client","owner":"Project lead (Danika)","priority":"Medium","as":"the project lead","want":"a simple monthly summary for the client","so":"the client sees progress and can decide next steps","details":"Followers per platform, total views, top three videos, next month's plan. One page.","ac":["Report sent in the first week of each month."]},{"key":"AB-40","title":"Keep backups of logins and brand files","owner":"Project lead (Danika)","priority":"Medium","as":"the project lead","want":"the passwords, 2-step backup codes and brand files kept safe in two places","so":"the channel can be recovered even if a phone or laptop is lost","details":"Password manager plus a sealed copy held by the client.","ac":["Backup confirmed by the client."]}]}];
const SECTIONS=[{"name":"Channel identity","why":"Used on every profile — must be final before anything is created.","items":[{"id":"name_ok","t":"Channel name and handle","k":"choice","o":["Keep “Apple Box” with @appleboxlk","Keep “Apple Box”, but I prefer a different handle","Change the channel name"],"req":1,"h":"The channel name is what viewers see (“Apple Box”). The handle is the @username in the link. We checked: @applebox is already taken on YouTube, so it cannot be used. Our suggestion is @appleboxlk — the same on YouTube, Facebook, Instagram and TikTok."},{"id":"handle_alt","t":"If you chose a different handle or a new name, write 2–3 options in order of preference","k":"textarea","h":"Examples: @appleboxmedia, @appleboxtv, @appleboxfilms. We will check which ones are free on all four platforms and confirm with you before creating anything."},{"id":"tagline","t":"One-line tagline (optional)","k":"text","h":"Shown under the name in bios. Example: “Short films and shows from Sri Lanka.”"},{"id":"logo","t":"Logo — do you already have one?","k":"choice","o":["Yes — we will send the files","We have a rough idea or sketch","No — please design one for us"],"req":1,"h":"If you have a logo, please send the original files (AI, SVG, PDF or the largest PNG you have). If not, we will prepare options for you to choose from."},{"id":"logo_notes","t":"Logo brief: colours, style, and anything to include or avoid","k":"textarea","req":1,"h":"Example: “Red and black, modern, should feel like a film studio. No apple fruit.” If you already have a logo, tell us the exact colour codes if you know them."},{"id":"logo_send","t":"How will you send the logo files?","k":"text","h":"Google Drive link, WeTransfer, WhatsApp or email — and to whom."},{"id":"lang","t":"Languages","k":"multi","o":["Sinhala","Tamil","English"],"req":1,"h":"Tick all that apply. This decides bios, titles, captions and subtitles."},{"id":"lang_main","t":"Main language for titles and descriptions","k":"choice"," function boardHTML(){
  let h=`<div class="filters"><span class="fl">Show</span><button class="chip ${filterOwner==='all'?'on':''}" data-f="all">Everyone</button>${OWNER_LIST.map(o=>`<button class="chip ${filterOwner===o?'on':''}" data-f="${esc(o)}">${esc(o)}</button>`).join('')}</div><main class="board">`;
  PHASES.forEach((p,pi)=>{
    const vis=p.stories.filter(s=>filterOwner==='all'||(owners[s.key]||s.owner)===filterOwner); if(!vis.length) return;
    const list=p.stories.map(s=>status[s.key]||'todo'), pc=counts(list);
    h+=`<section class="col"><div class="col-h"><div class="row"><span class="eyebrow">Epic ${pi+1} · ${esc(p.owner)}</span><span class="count mono">${pc.done}/${list.length}</span></div><h2>${esc(p.name)}</h2>${barHTML(pc,list.length)}</div><div class="tasks">`;
    vis.forEach(s=>{const k=s.key, st=status[k]||'todo', o=owners[k]||s.owner, open=openSet.has(k)?1:0;
      h+=`<div class="task ${st}" data-open="${open}"><div class="task-top"><span class="key mono">${k}</span><span class="pri ${s.priority}">${s.priority}</span><button class="st" data-k="${k}" aria-label="Status ${LABEL[st]}, click to change">${ICON[st]}${LABEL[st]}</button></div>
        <div class="t">${esc(s.title)}</div><div class="oname">Owner: ${esc(o)}</div>
        <button class="more" data-more="${k}">${open?'Hide story':'Show story'}</button>
        <dl class="detail"><dt>Story</dt><dd>As <b>${esc(s.as)}</b>, I want ${esc(s.want)}, so that ${esc(s.so)}.</dd>
        <dt>Details</dt><dd>${esc(s.details)}</dd><dt>Done when</dt><dd><ul>${s.ac.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></dd>
        <dt>Owner</dt><dd><input data-owner="${k}" value="${esc(owners[k]||'')}" placeholder="${esc(s.owner)} (type a name to change)"></dd></dl></div>`;});
    h+=`</div></section>`;});
  return h+`</main>`;
}
function answersHTML(){
  const people=(answers&&answers.people)||{}; const keys=Object.keys(people).sort((a,b)=>(people[b].updatedAt||0)-(people[a].updatedAt||0));
  if(answers&&answers.vals&&Object.keys(answers.vals).length) { people["_legacy"]={vals:answers.vals,name:"(no name)",updatedAt:0}; if(!keys.includes("_legacy")) keys.push("_legacy"); }
  if(!answersPath()) return `<div class="answers"><section><div class="sh">No client access code yet</div><div class="ans"><div class="v empty">Open “Team &amp; access” and set a client access code first. Then send the code to the client with the checklist link.</div></div></section></div>`;
  if(!keys.length) return `<div class="answers"><section><div class="sh">No answers yet</div><div class="ans"><div class="v empty">When someone fills in the client page, their answers appear here, one set per person.</div></div></section></div>`;
  if(!person||!people[person]) person=keys[0];
  const p=people[person], v=p.vals||{};
  let h=`<div class="filters" style="max-width:900px"><span class="fl">Submitted by</span>${keys.map(k=>`<button class="chip ${k===person?'on':''}" data-person="${esc(k)}">${esc(people[k].name||k)}</button>`).join('')}</div>`;
  const delBtn=delArm===person?`<button class="chip" data-del="${esc(person)}" style="border-color:#c0392b;background:#c0392b;color:#fff">Yes, delete ${esc(p.name||person)}'s answers</button> <button class="chip" data-delcancel="1">Cancel</button>`:`<button class="chip" data-delarm="${esc(person)}" style="color:#c0392b">Delete this submission</button>`;
  h+=`<div class="meta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${esc(p.name||person)} · last updated ${p.updatedAt?new Date(p.updatedAt).toLocaleString():'—'} ${delBtn}</div><div class="answers">`;
  SECTIONS.forEach((sec,i)=>{const done=sec.items.filter(it=>{const x=v[it.id];return Array.isArray(x)?x.length:!!(x&&String(x).trim());}).length;
    h+=`<section><div class="sh">Part ${i+1} · ${esc(sec.name)}<span class="mono">${done}/${sec.items.length}</span></div>`;
    sec.items.forEach(it=>{const x=v[it.id];const val=Array.isArray(x)?x.join(", "):(x||"");
      const others=keys.filter(k=>k!==person).map(k=>{const y=(people[k].vals||{})[it.id];const yv=Array.isArray(y)?y.join(", "):(y||"");return yv&&yv!==val?`<div class="v" style="font-size:12px;color:var(--ink-3);margin-top:4px">${esc(people[k].name||k)}: ${esc(yv)}</div>`:'';}).join('');
      h+=`<div class="ans ${it.req?'req':''}"><div class="q">${esc(it.t)}</div><div><div class="v ${val?'':'empty'}">${val?esc(val):'—'}</div>${others}</div></div>`;});
    h+=`</section>`;});
  return h+`</div>`;
}

    <div class="ans"><div class="q">Add a teammate</div><div><form data-add-email="1" style="display:flex;gap:8px;flex-wrap:wrap"><input type="email" required placeholder="their Gmail address" style="flex:1;min-width:200px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"><button class="chip" type="submit">Add</button></form><div class="v empty" style="font-size:12px;margin-top:6px">They sign in with Google using this exact address.</div></div></div>

function render(){
  const root=document.getElementById('root');
  if(!user){ root.innerHTML=loginHTML(authMsg); return; }
  if(!team){ root.innerHTML=loginHTML(teamErr||"Loading team list…"); return; }
  if(!isTeam()){ root.innerHTML=loginHTML(`${user.email} is not on the team list. Ask Danika to add you under “Team & access”.`); return; }
  root.innerHTML=header()+(tab==='board'?boardHTML():tab==='team'?teamHTML():answersHTML());
}

let saveTimer=null, pending=false;
function persist(){
  if(!window.AppleBoxStore||!window.AppleBoxStore.configured){conn="err";connMsg="Not saved (no Firebase)";render();return;}
  clearTimeout(saveTimer); pending=true; conn="saving"; connMsg="Saving…"; updStatus();
  saveTimer=setTimeout(async()=>{try{await window.AppleBoxStore.merge("board/state",{status,owners},who);pending=false;conn="live";connMsg="Saved · live";}
    catch(e){console.error(e);conn="err";connMsg="Save failed: "+(e.code||e.message);} updStatus();},400);
}
function updStatus(){const el=document.querySelector('.status'); if(el){el.className='status '+conn; el.innerHTML='<i></i>'+esc(connMsg);}}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-signin]')){authMsg="";render();window.AppleBoxStore.signIn().catch(err=>{authMsg="Sign-in failed: "+(err.code||err.message);render();});return;}
  if(e.target.closest('[data-signout]')){e.preventDefault();window.AppleBoxStore.signOut();return;}
  const rm=e.target.closest('[data-rm-email]'); if(rm){saveTeam({emails:team.emails.filter(x=>x!==rm.dataset.rmEmail)});return;}
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;localStorage.setItem('ab-tab',tab);render();return;}
  const b=e.target.closest('.st'); if(b){const k=b.dataset.k;status[k]=ORDER[(ORDER.indexOf(status[k]||'todo')+1)%3];render();persist();return;}
  const m=e.target.closest('.more'); if(m){const k=m.dataset.more;openSet.has(k)?openSet.delete(k):openSet.add(k);render();return;}
  const pp=e.target.closest('[data-person]'); if(pp){person=pp.dataset.person;delArm=null;render();return;}
  const da=e.target.closest('[data-delarm]'); if(da){delArm=da.dataset.delarm;render();return;}
  if(e.target.closest('[data-delcancel]')){delArm=null;render();return;}
  const dd=e.target.closest('[data-del]'); if(dd){const k=dd.dataset.del; delArm=null; person=null; conn="saving"; connMsg="Deleting…"; updStatus();
    (k==="_legacy"?window.AppleBoxStore.removeFields(answersPath(),["vals"],who):window.AppleBoxStore.removeFields(answersPath(),["people."+k],who))
      .then(()=>{conn="live";connMsg="Deleted";updStatus();}).catch(err=>{console.error(err);conn="err";connMsg="Delete failed: "+(err.code||err.message);updStatus();}); return;}
  const f=e.target.closest('.chip[data-f]'); if(f){filterOwner=f.dataset.f;render();}
});
async function saveTeam(patch){
  teamBusy="Saving…"; render();
  try{ await window.AppleBoxStore.merge("config/team",patch,user.email); teamBusy=""; }
  catch(err){ console.error(err); teamBusy="Save failed: "+(err.code||err.message); render(); }
}
document.addEventListener('submit',async e=>{
  const f=e.target; if(!f.dataset) return;
  if(f.dataset.addEmail){e.preventDefault(); const v=f.querySelector('input').value.trim().toLowerCase(); if(v&&!team.emails.includes(v)) await saveTeam({emails:[...team.emails,v]}); return;}
  if(f.dataset.setCode){e.preventDefault(); const c=codeSlug(f.querySelector('input').value); if(c.length<6) return;
    teamBusy="Saving…"; render();
    try{ await window.AppleBoxStore.merge("intake/client-"+c,{created:Date.now()},user.email); await window.AppleBoxStore.merge("config/team",{clientCode:c},user.email); teamBusy=""; }
    catch(err){ console.error(err); teamBusy="Save failed: "+(err.code||err.message); render(); }
    return;}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-owner]')){const v=e.target.value.trim(); if(v) owners[e.target.dataset.owner]=v; else delete owners[e.target.dataset.owner]; render(); persist();}
  if(e.target.id==='who'){who=e.target.value.trim();localStorage.setItem('ab-who',who);}
});
render();
setTimeout(()=>{ if(conn==='off'){ conn='err'; connMsg='Database script did not load — check internet / firebase-config.js'; updStatus(); } },8000);
function stopWatches(){ if(unwatchBoard){unwatchBoard();unwatchBoard=null;} if(unwatchAns){unwatchAns();unwatchAns=null;} }
function watchAnswers(){
  if(unwatchAns){unwatchAns();unwatchAns=null;} answers=null; person=null;
  const p=answersPath(); if(!p){ if(tab==='answers') render(); return; }
  unwatchAns=window.AppleBoxStore.watch(p,d=>{ answers=d; if(tab==='answers') render(); },err=>console.error(err));
}
async function bootstrapTeam(S){
  // First ever sign-in by the owner: create the team list with this account.
  if(!BOOTSTRAP.includes((user.email||"").toLowerCase())) return false;
  try{ await S.merge("config/team",{emails:[user.email.toLowerCase()],clientCode:""},user.email); return true; }catch(e){ console.error("bootstrap",e); return false; }
}
document.addEventListener('applebox-store-ready',()=>{
  const S=window.AppleBoxStore; if(!S.configured){conn="err";connMsg="Not connected";user=null;render();return;}
  let unwatchTeam=null, lastAnsPath=null;
  S.onAuth(async u=>{
    user=u||null; team=null; teamErr=""; stopWatches(); if(unwatchTeam){unwatchTeam();unwatchTeam=null;} lastAnsPath=null;
    render(); if(!user) return;
    if(!who&&user.displayName){who=user.displayName;localStorage.setItem('ab-who',who);}
    const startTeamWatch=()=>{ unwatchTeam=S.watch("config/team",d=>{
        team=d||{emails:[],clientCode:""}; teamErr="";
        if(!isTeam()){ stopWatches(); lastAnsPath=null; render(); return; }
        if(!unwatchBoard){ unwatchBoard=S.watch("board/state",d=>{ if(pending) return; status=(d&&d.status)||{}; owners=(d&&d.owners)||{}; conn="live"; connMsg=d&&d.updatedBy?`Live · last change by ${d.updatedBy}`:"Live"; render(); },err=>{conn="err";connMsg="Connection error: "+err.code;render();}); }
        if(answersPath()!==lastAnsPath){ lastAnsPath=answersPath(); watchAnswers(); }
        render();
      },async err=>{
        if(err.code==='permission-denied'){
          // Either not on the team, or the team list does not exist yet.
          let existsNow=false;
          if(BOOTSTRAP.includes((user.email||"").toLowerCase())){ existsNow=await bootstrapTeam(S); }
          if(existsNow){ if(unwatchTeam) unwatchTeam(); startTeamWatch(); return; }
          team={emails:[],clientCode:""}; render(); return;
        }
        teamErr="Connection error: "+err.code; render();
      }); };
    startTeamWatch();
  });
});
</script>
</body>
